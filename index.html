<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="wallet" />
<meta name="theme-color" content="#0d9488" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<title>清醒消费</title>
<style>
:root{
  --bg:#f7f8f8; --card:#fff; --text:#111827; --muted:#6b7280; --line:#eceef0;
  --brand:#0d9488; --brand-soft:#ecfdf5; --danger:#dc2626; --warn:#d97706;
  --radius:18px; --shadow:0 1px 3px rgba(16,24,40,.04);
  --nav:62px; --safe:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px); --topH:56px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + var(--safe) + 12px)}
.top{padding:calc(14px + var(--safeT)) 20px 6px;position:sticky;top:0;background:rgba(247,248,248,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.main{padding:8px 16px 20px}
.main.ai{height:calc(100vh - var(--topH) - var(--nav) - var(--safe));height:calc(100dvh - var(--topH) - var(--nav) - var(--safe));overflow:hidden;padding-bottom:8px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.soft{background:linear-gradient(180deg,#fff,#f6fffc);border:1px solid #dff3ee}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:12px 14px;border-radius:14px;background:#f9fafb}
.metric b{display:block;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.metric.big{background:var(--brand-soft)}
.metric.big b{font-size:22px;color:#0f766e}
button.metric{border:0;width:100%;text-align:left;color:inherit;display:block}
button.metric:active{transform:scale(.98)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.section-title h2{margin:0;font-size:15px;font-weight:650}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:600;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#fef2f2;color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:999px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#99f6e4;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
textarea{min-height:88px;resize:vertical}
.item{padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.tag{font-size:11px;color:var(--muted);background:#f3f4f6;padding:2px 8px;border-radius:999px}
.tag.warn{background:#fff7ed;color:#c2410c}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:5px;vertical-align:middle}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;margin:4px 4px 0 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);height:calc(var(--nav) + var(--safe));padding:6px 8px var(--safe);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;z-index:20}
.nav button{border:0;background:transparent;color:#9ca3af;font-size:10.5px;border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button.active{color:var(--brand);font-weight:700}
.nav button.plus{color:#fff}
.nav button.plus i{width:46px;height:46px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;margin-top:-14px;box-shadow:0 4px 12px rgba(13,148,136,.35)}
.nav button.plus svg{width:24px;height:24px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.chat{display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1 1 0;min-height:0;padding:4px 0 8px}
.bubble-wrap{display:flex;flex-direction:column;max-width:92%}
.bubble-wrap.me{align-self:flex-end;align-items:flex-end}
.bubble-wrap.ai{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bubble.me{background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bubble.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble-wrap .tools{display:flex;gap:2px;margin-top:3px;opacity:0;transition:opacity .15s;pointer-events:none}
.bubble-wrap:hover .tools,.bubble-wrap.tools-show .tools{opacity:1;pointer-events:auto}
.icon{border:0;background:transparent;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#b0b6bf;padding:0}
.icon:active{background:#f3f4f6;color:#6b7280}
.icon svg{width:12px;height:12px}
.session-divider{display:flex;align-items:center;gap:8px;margin:6px 0;color:#c8ccd2;font-size:10px}
.session-divider::before,.session-divider::after{content:'';flex:1;height:1px;background:#eef0f2}
.ai-page{display:flex;flex-direction:column;height:100%;min-height:0}
.ai-chat-panel{display:flex;flex-direction:column;flex:1 1 0;min-height:0;overflow:hidden}
.ai-composer-panel{flex:0 0 auto;margin-top:6px}
.composer{position:relative}
.composer textarea{min-height:46px;max-height:110px;resize:none;overflow-y:auto;border-radius:23px;padding:12px 52px 12px 16px;background:#fff;box-shadow:var(--shadow)}
.ai-send-btn{position:absolute;right:5px;bottom:5px;border:0;border-radius:50%;padding:0;width:36px;height:36px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.ai-send-btn:active{transform:scale(.94)}
.ai-send-btn svg{width:16px;height:16px}
.list-btn{width:100%;text-align:left;border:0;background:transparent;padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:inherit}
.list-btn:last-child{border-bottom:0}
.list-btn strong{font-size:14px;font-weight:600}
.list-btn span{color:var(--muted);font-size:12px}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px;flex:0 0 auto}
.chat-head button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:8px;display:flex;align-items:center;gap:4px}
.chat-head strong{font-size:14px;font-weight:700;color:var(--text)}
.thinking{display:flex;align-items:center;gap:6px;padding:9px 12px;color:var(--muted);font-size:13px}
.thinking .dots{display:inline-flex;gap:3px}
.thinking .dots i{width:5px;height:5px;border-radius:50%;background:#c8ccd2;animation:blink 1.2s infinite ease-in-out}
.thinking .dots i:nth-child(2){animation-delay:.2s}
.thinking .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cursor-blink{display:inline-block;width:2px;height:14px;background:var(--brand);margin-left:1px;vertical-align:-2px;animation:caret 1s infinite}
@keyframes caret{50%{opacity:0}}
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:min(430px,100%);background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--safe));max-height:88vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 16px);transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90%;text-align:center}
.toast.show{opacity:1}
.progress{height:6px;background:#eef2f1;border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress i.warn{background:#f59e0b}
.progress i.danger{background:#f43f5e}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .day{border:0;background:#f9fafb;border-radius:10px;min-height:48px;padding:6px 4px;text-align:left}
.cal .day.on{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.cal .day.today{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cal .day.sel{box-shadow:inset 0 0 0 1.5px #111827}
.cal .day b{display:block;font-size:12px}
.cal .day em{display:block;font-style:normal;font-size:10px;color:var(--danger);margin-top:2px}
.cal .day i{display:block;font-style:normal;font-size:10px;color:#047857;margin-top:1px}
.stack{display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch span{flex:1;min-width:0;font-size:14px;line-height:1.4}
.switch input[type=checkbox]{flex:0 0 auto;width:44px;height:26px;appearance:none;-webkit-appearance:none;background:#e5e7eb;border-radius:999px;position:relative;outline:none;border:0;cursor:pointer;transition:background .15s;padding:0}
.switch input[type=checkbox]::before{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input[type=checkbox]:checked{background:var(--brand)}
.switch input[type=checkbox]:checked::before{transform:translateX(18px)}
.quiz-opt{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;text-align:left}
.quiz-opt.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
input[type=date]{width:100%;max-width:100%;display:block;min-width:0;height:44px;-webkit-appearance:none;appearance:none;padding-top:0;padding-bottom:0;line-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.sheet-modal{width:min(430px,100%);background:#fff;border-radius:22px 22px 0 0;height:min(80vh,620px);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{flex:0 0 auto;padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{margin:0;font-size:17px}
.sheet-body{flex:1;overflow-y:auto;padding:8px 16px calc(16px + var(--safe))}
.iconbtn,.ib{border:0;background:transparent;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#6b7280;padding:0;flex:0 0 auto;border-radius:8px}
.iconbtn:active,.ib:active{color:var(--brand)}
.iconbtn svg,.ib svg{width:20px;height:20px}
.iconbtn.danger{color:#dc2626}
.lnk{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 2px}
input[type=color]{width:34px;height:34px;padding:0;border:2px solid var(--line);border-radius:50%;cursor:pointer;background:none;flex:0 0 auto}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:50%}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kv>span{font-size:14px}
.kv input.narrow{width:72px;text-align:center;padding:8px}
.session-row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.session-row:last-child{border-bottom:0}
.session-row .pick{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.session-row .icons{display:flex;gap:2px;flex:0 0 auto}
.chart-modal-canvas{width:100%;height:220px}
.chart-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.chart-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px}
.chart-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart-chip.active{background:#111827;color:#fff;border-color:#111827}
.segmented{display:flex;background:#f3f4f6;border-radius:12px;padding:3px;gap:3px}
.segmented .qa-type{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:8px;border-radius:9px}
.segmented .qa-type.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tap{border:0;background:transparent;padding:2px 0;margin-top:2px;color:var(--muted);font-size:12px;text-align:left;font-variant-numeric:tabular-nums;display:block}
.tap:active{color:var(--brand)}
.nm{font-size:13.5px}
.bal{border:0;background:transparent;padding:0;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.bal:active{color:var(--brand)}
.accn{border:0;background:transparent;padding:0;font-size:16px;font-weight:700;color:var(--text);text-align:left}
.accn:active{color:var(--brand)}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:72px;border:0;background:var(--danger);color:#fff;font-weight:600;font-size:14px}
.swipe-in{position:relative;background:#fff;padding:11px 0;touch-action:pan-y;will-change:transform}
.fl{border:0;background:transparent;padding:2px 0;font-size:11.5px;font-weight:600;transition:opacity .15s}
.fl.inc{color:#047857}
.fl.exp{color:#b91c1c}
.fl.off{opacity:.3}
.fl.on{text-decoration:underline;text-underline-offset:3px}
.pact{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pact .sp{flex:1}
.mini-mask{position:fixed;inset:0;background:rgba(17,24,39,.4);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.mini{width:min(320px,100%);background:#fff;border-radius:18px;padding:16px}
.mini h4{margin:0 0 4px;font-size:15px}
.mini .note{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.5}
.mini .field{margin-top:10px;margin-bottom:0}
.mini .btns{display:flex;gap:8px;margin-top:14px}
.mini .btns .btn{flex:1}
.rpager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:14px -16px 0}
.rpager::-webkit-scrollbar{display:none}
.rpg{flex:0 0 100%;scroll-snap-align:center;padding:0 16px}
.pgdots{display:flex;justify-content:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.pgdot{width:6px;height:6px;border-radius:99px;background:var(--line)}
.pgdot.on{background:var(--brand)}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="topbar"><h1 id="title">首页</h1></header>
  <main class="main" id="view"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div class="modal-mask hidden" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'sober_wallet_v3';
const PROMPT = `你是一名理性、温和、注重预算边界的个人消费决策助手。你的任务不是鼓励用户消费，也不是否定一切非必要消费，而是帮助用户区分必要消费、合理改善、快乐消费、功能升级、重复购买、促销诱导和过量囤货。
优先检查商品是否解决真实问题、是否已经存在替代品、是否符合预算、是否触碰安全余额、是否因平台推荐或优惠而被放大吸引力。
允许预算内的快乐消费，但不允许用储蓄、安全余额、固定支出资金或其他必要预算弥补快乐预算超额。
不羞辱用户，不使用"你太浪费""你不自律"等评价。发现消费理由不充分时，应清楚说明缺少什么证据，并建议具体冷静期。
对正常吃饭、必要交通、消耗品补充等真实需求，不应施加不必要的道德压力。
你的结论必须简明、明确、可执行，按以下结构回复：1.主要购买理由 2.当前最可能影响判断的因素 3.购买的真实收益 4.不购买的实际损失 5.建议 6.建议等待时间。`;

const DEFAULT_TAGS = () => ([
  {id:'fixed', name:'固定支出', color:'#475569', over:false, quiz:true, cool:0},
  {id:'daily', name:'日常生活', color:'#0d9488', over:false, quiz:true, cool:0},
  {id:'temp', name:'临时必要', color:'#0891b2', over:true, quiz:true, cool:0},
  {id:'meal', name:'正常吃饭', color:'#16a34a', over:true, quiz:true, cool:0},
  {id:'takeout', name:'外卖', color:'#f59e0b', over:false, quiz:true, cool:0},
  {id:'snack', name:'零食饮料', color:'#db2777', over:false, quiz:true, cool:7},
  {id:'consumable', name:'消耗品', color:'#7c3aed', over:false, quiz:true, cool:0},
  {id:'upgrade', name:'功能升级', color:'#c2410c', over:false, quiz:true, cool:14},
  {id:'stock', name:'囤货', color:'#a16207', over:false, quiz:true, cool:7},
  {id:'hobby', name:'兴趣手工', color:'#0ea5e9', over:false, quiz:true, cool:7},
  {id:'fun', name:'娱乐', color:'#dc2626', over:false, quiz:true, cool:7},
  {id:'gift', name:'礼物', color:'#e11d48', over:false, quiz:true, cool:0},
  {id:'other', name:'其他', color:'#94a3b8', over:true, quiz:true, cool:7}
]);

const DEFAULT = () => ({
  settings:{safe:0,quizAmount:25,modelOn:false},
  api:{baseURL:'https://api.openai.com/v1',apiKey:'',model:'gpt-4o-mini',models:[],timeout:30000,prompt:PROMPT},
  accounts:[
    {id:'cash',kind:'cash',name:'现金',balance:0,note:''},
    {id:'wechat',kind:'wechat',name:'微信',balance:0,note:''},
    {id:'alipay',kind:'alipay',name:'支付宝',balance:0,note:''},
    {id:'bank',kind:'bank',name:'银行卡',balance:0,note:''}
  ],
  tags:DEFAULT_TAGS(),safeAlloc:{},budgets:{},goals:[],plans:[],txs:[],
  sessions:[{id:'s0',name:'对话 1',chat:[],createdAt:Date.now()}],
  ui:{month:ym(new Date()),setPanel:null,calDay:null,calFilter:null,curSession:'s0'}
});

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-2)}
function today(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function ym(d){return today(d).slice(0,7)}
function money(n){return '¥'+Number(n||0).toFixed(2).replace(/\.00$/,'')}
function r2(n){return Math.round(Number(n||0)*100)/100}
function moneyS(n){n=r2(n);return (n<0?'-':'')+money(Math.abs(n))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function periodKey(date=today()){return date.slice(0,7)}
function periodName(k){return `${Number(k.slice(5,7))}月`}
function chip(t,bg,c){return `<span class="chip" style="background:${bg};color:${c}">${t}</span>`}

// 数据迁移：专项改为存取流水；安全余额总数由各账户分配汇总
function migrate(d){
  (d.goals||[]).forEach(g=>{
    if(!Array.isArray(g.log)){
      g.log=[];const al=g.alloc||{};
      Object.keys(al).forEach(k=>{if(Number(al[k])>0)g.log.push({id:uid(),acc:k,amt:Number(al[k]),ts:Date.now()});});
      const un=r2(Number(g.saved||0)-g.log.reduce((s,x)=>s+x.amt,0));
      if(un>0.004&&d.accounts&&d.accounts[0])g.log.push({id:uid(),acc:d.accounts[0].id,amt:un,ts:Date.now()});
    }
    g.saved=r2(g.log.reduce((s,x)=>s+x.amt,0));delete g.alloc;
  });
  d.safeAlloc=d.safeAlloc||{};
  const s=Object.values(d.safeAlloc).reduce((a,b)=>a+Number(b||0),0);
  if(s>0)d.settings.safe=r2(s);
  return d;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return DEFAULT();
    const parsed=JSON.parse(raw);
    const base=DEFAULT();
    const merged=Object.assign(base,parsed,{
      settings:Object.assign(base.settings,parsed.settings||{}),
      api:Object.assign(base.api,parsed.api||{}),
      ui:Object.assign(base.ui,parsed.ui||{}),
      tags:Array.isArray(parsed.tags)&&parsed.tags.length?parsed.tags:base.tags
    });
    if(Array.isArray(parsed.chat)&&parsed.chat.length&&(!Array.isArray(parsed.sessions)||!parsed.sessions.length)){
      merged.sessions=[{id:'s0',name:'对话 1',chat:parsed.chat,createdAt:Date.now()}];merged.ui.curSession='s0';
    }else if(!Array.isArray(merged.sessions)||!merged.sessions.length){
      merged.sessions=[{id:'s0',name:'对话 1',chat:[],createdAt:Date.now()}];merged.ui.curSession='s0';
    }
    if(!merged.ui.curSession||!merged.sessions.find(s=>s.id===merged.ui.curSession))merged.ui.curSession=merged.sessions[0].id;
    merged.sessions.forEach(s=>(s.chat||[]).forEach(m=>{if(m.streaming){m.streaming=false;if(!m.text)m.text='（回复中断）';}}));
    if(merged.ui.setPanel==='accounts')merged.ui.setPanel=null;
    merged.tags.forEach(t=>{t.quiz=true;});
    return migrate(merged);
  }catch{return DEFAULT();}
}

function miniForm({title,note,fields,okText='确定',onOk}){
  const m=document.createElement('div');m.className='mini-mask';
  const fh=fields.map((f,i)=>{
    const lab=f.label?`<span>${esc(f.label)}</span>`:'';
    let inp;
    if(f.type==='textarea')inp=`<textarea data-f="${i}" placeholder="${esc(f.placeholder||'')}">${esc(f.value??'')}</textarea>`;
    else if(f.type==='select')inp=`<select data-f="${i}">${(f.options||[]).map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if(f.type==='number')inp=`<input data-f="${i}" type="number" step="0.01" inputmode="decimal" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'0')}">`;
    else inp=`<input data-f="${i}" type="text" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}">`;
    return `<label class="field">${lab}${inp}</label>`;
  }).join('');
  m.innerHTML=`<div class="mini"><h4>${esc(title)}</h4>${note?`<p class="note">${esc(note)}</p>`:''}${fh}<div class="btns"><button type="button" class="btn line" data-x>取消</button><button type="button" class="btn" data-ok>${esc(okText)}</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.addEventListener('click',e=>{if(e.target===m)close();});
  m.querySelector('[data-x]').onclick=close;
  const submit=()=>{
    const v={};fields.forEach((f,i)=>{v[f.key]=m.querySelector(`[data-f="${i}"]`).value;});
    if(onOk(v)!==false)close();
  };
  m.querySelector('[data-ok]').onclick=submit;
  m.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}}));
  const first=m.querySelector('input,textarea,select');
  setTimeout(()=>{if(first){first.focus();if(first.select&&first.type!=='number')try{first.select()}catch{}}},60);
}

// ---------- 左滑删除 ----------
function bindSwipe(root){
  const W=72;
  const rows=[...root.querySelectorAll('.swipe')];
  const setX=(r,x,anim=true)=>{const c=r.querySelector('.swipe-in');c.style.transition=anim?'transform .2s':'none';c.style.transform=`translateX(${x}px)`;r._x=x;};
  const closeAll=except=>rows.forEach(r=>{if(r!==except&&(r._x||0)!==0)setX(r,0);});
  rows.forEach(r=>{
    let sx=0,sy=0,base=0,dir=null;r._x=0;
    r.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;base=r._x||0;dir=null;closeAll(r);},{passive:true});
    r.addEventListener('touchmove',e=>{
      const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
      if(!dir){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;dir=Math.abs(dx)>Math.abs(dy)?'h':'v';}
      if(dir!=='h')return;
      setX(r,Math.max(-W,Math.min(0,base+dx)),false);
    },{passive:true});
    r.addEventListener('touchend',()=>{if(dir==='h'){setX(r,(r._x||0)<-W/2?-W:0);r._swiped=Date.now();}});
  });
  $('modal').onclick=e=>{if(!e.target.closest('.swipe'))closeAll(null);};
  return el=>{
    const r=el.closest('.swipe');if(!r)return false;
    if(Date.now()-(r._swiped||0)<300)return true;
    if((r._x||0)<0){setX(r,0);return true;}
    return false;
  };
}

// ---------- 资金计算 ----------
function allocSum(map){return S.accounts.reduce((a,x)=>a+Number((map||{})[x.id]||0),0)}
function safeAllocOn(id){return Number((S.safeAlloc||{})[id]||0)}
function goalAllocOn(g,id){return (g.log||[]).reduce((a,x)=>a+(x.acc===id?Number(x.amt):0),0)}
function goalsOn(id){return S.goals.reduce((a,g)=>a+goalAllocOn(g,id),0)}
function accFree(a){return r2(Number(a.balance||0)-safeAllocOn(a.id)-goalsOn(a.id))}
function syncGoal(g){g.log=g.log||[];g.saved=r2(g.log.reduce((s,x)=>s+Number(x.amt),0));}
function totalAssets(){return S.accounts.reduce((a,b)=>a+Number(b.balance||0),0);}
function savings(){return S.goals.reduce((a,b)=>a+Number(b.saved||0),0);}
function free(){return r2(totalAssets()-Number(S.settings.safe||0)-savings());}
function budget(p=periodKey()){if(!S.budgets[p])S.budgets[p]={total:0,set:false,tagLimits:{}};return S.budgets[p];}
// 退款以负数支出记录，所以这里自然会冲抵已花金额
function spentTotal(p=periodKey()){return S.txs.filter(t=>t.type==='expense'&&!t.refunded&&periodKey(t.date)===p).reduce((a,b)=>a+Number(b.amount||0),0);}
function spentByTag(tagId,p=periodKey()){return S.txs.filter(t=>t.type==='expense'&&!t.refunded&&t.tagId===tagId&&periodKey(t.date)===p).reduce((a,b)=>a+Number(b.amount||0),0);}
function remain(p=periodKey()){const b=budget(p);return b.set?Number(b.total)-spentTotal(p):null;}
function acc(id){return S.accounts.find(a=>a.id===id);}
function tag(id){return S.tags.find(t=>t.id===id)||S.tags.find(t=>t.id==='other')||{id:'',name:'其他',color:'#94a3b8'};}
function nextTagColor(){const hue=(S.tags.length*137.508)%360;return hslToHex(hue,62,46);}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));const toHex=x=>Math.round(255*x).toString(16).padStart(2,'0');return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;}

// ---------- AI 调用 ----------
async function callAI(messages,onDelta,withSnapshot){
  if(!S.settings.modelOn)throw new Error('请先在"我的-模型 API"中启用模型');
  if(!S.api.baseURL||!S.api.apiKey)throw new Error('请先填写 Base URL 和 API Key');
  const sysText=(S.api.prompt||PROMPT)+(withSnapshot?SNAPSHOT_INTRO+buildSnapshot():'');
  const ctrl=new AbortController();
  const limit=S.api.timeout||30000;let t;
  const arm=()=>{clearTimeout(t);t=setTimeout(()=>ctrl.abort(),limit);};
  arm();
  const pick=j=>j?.choices?.[0]?.message?.content||'';
  try{
    const res=await fetch(S.api.baseURL.replace(/\/$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.api.apiKey},
      body:JSON.stringify({model:S.api.model,temperature:0.4,stream:!!onDelta,messages:[{role:'system',content:sysText},...messages]}),
      signal:ctrl.signal
    });
    if(!res.ok){let d='';try{d=(await res.text()).slice(0,120);}catch{}throw new Error('HTTP '+res.status+(d?' '+d:''));}
    const ct=(res.headers.get('content-type')||'').toLowerCase();
    if(!onDelta||!res.body||ct.includes('application/json')){
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||'接口返回错误');
      const txt=pick(data)||data.choices?.[0]?.message?.reasoning_content||'';
      if(onDelta&&txt)onDelta(txt);
      return txt;
    }
    const reader=res.body.getReader();const dec=new TextDecoder();
    let buf='',raw='',full='',reason='';
    const handle=line=>{
      const s=line.trim();if(!s.startsWith('data:'))return;
      const payload=s.slice(5).trim();if(!payload||payload==='[DONE]')return;
      let j;try{j=JSON.parse(payload);}catch{return;}
      if(j.error)throw new Error(j.error.message||'接口返回错误');
      const d=j.choices?.[0]?.delta||{};
      if(d.content){full+=d.content;onDelta(full);}
      else if(d.reasoning_content||d.reasoning){reason+=(d.reasoning_content||d.reasoning);}
    };
    while(true){
      const{value,done}=await reader.read();if(done)break;
      arm();
      const chunk=dec.decode(value,{stream:true});raw+=chunk;buf+=chunk;
      const lines=buf.split(/\r?\n/);buf=lines.pop();
      lines.forEach(handle);
    }
    if(buf)handle(buf);
    if(!full&&!reason&&raw.trim()){
      try{const data=JSON.parse(raw);full=pick(data);if(full)onDelta(full);}catch{}
    }
    return full||reason;
  }catch(e){
    if(e.name==='AbortError')throw new Error('请求超时');
    if(/Failed to fetch|NetworkError|CORS/i.test(String(e.message||e)))throw new Error('当前API服务不支持浏览器直接访问，需要更换支持浏览器调用的接口，或使用自己的代理服务。');
    throw e;
  }finally{clearTimeout(t);}
}

let thinkingTimer=null;
function startThinking(){
  stopThinking();
  const box=$('chatBox');if(!box)return;
  const el=document.createElement('div');el.className='thinking';el.id='thinkingRow';
  el.innerHTML=`<span class="dots"><i></i><i></i><i></i></span><span id="thinkingSec">思考中 0s</span>`;
  box.appendChild(el);box.scrollTop=box.scrollHeight;
  let sec=0;thinkingTimer=setInterval(()=>{sec++;const s=$('thinkingSec');if(s)s.textContent=`思考中 ${sec}s`;},1000);
}
function stopThinking(){clearInterval(thinkingTimer);thinkingTimer=null;$('thinkingRow')?.remove();}

async function replyAI(){
  const s=curSession();const sid=s.id;
  const hist=contextSince(s.chat).slice(-8).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
  if(!S.settings.modelOn){
    const text='（未启用模型，本地简要建议）\n先看是否在本月预算内，是否会碰到安全余额；若可替代或可等待，先放 7 天；快乐消费可以有，但别动专项储蓄和安全余额。';
    s.chat.push({role:'assistant',text,at:Date.now()});save();render();
    const box=$('chatBox');if(box)box.scrollTop=box.scrollHeight;return;
  }
  aiBusy=true;
  const msg={role:'assistant',text:'',at:Date.now(),streaming:true};
  s.chat.push(msg);const idx=s.chat.length-1;
  startThinking();
  const paint=()=>{
    if(page!=='ai'||S.ui.curSession!==sid)return;
    const box=$('chatBox');if(!box)return;
    let el=box.querySelector(`[data-idx="${idx}"] .bubble`);
    if(!el){
      stopThinking();
      box.querySelector('.empty')?.remove();
      box.insertAdjacentHTML('beforeend',bubble(msg,idx,s));
      el=box.querySelector(`[data-idx="${idx}"] .bubble`);
    }
    if(el)el.innerHTML=esc(msg.text)+'<span class="cursor-blink"></span>';
    box.scrollTop=box.scrollHeight;
  };
  try{
    const full=await callAI(hist,t=>{msg.text=t;paint();},true);
    msg.text=full||msg.text||'（没有收到回复内容）';
  }catch(e){
    msg.text=(msg.text?msg.text+'\n\n':'')+'出错了：'+e.message;
  }
  msg.streaming=false;aiBusy=false;stopThinking();
  save();render();
  const box=$('chatBox');if(box)box.scrollTop=box.scrollHeight;
}
async function retryReply(i){if(aiBusy)return toast('AI 正在回复，请稍等');const s=curSession();s.chat=s.chat.slice(0,i);save();render();await replyAI();}

}

function planWarnHTML(amount,tagId,inBudget){
  if(!amount)return '';const msgs=[];let level='ok';
  if(totalAssets()-amount<S.settings.safe){msgs.push('花后资产可能低于安全余额 '+money(S.settings.safe)+'。');level='danger';}
  const b=budget();
  if(inBudget){
    if(b.set){
      const tagLimit=b.tagLimits?.[tagId];
      if(tagLimit){const left=Number(tagLimit)-spentByTag(tagId)-amount;if(left<0){msgs.push('该标签本月预算超出 '+money(Math.abs(left))+'。');level=level==='danger'?'danger':'warn';}else if(left<=30){msgs.push('购买后该标签只剩 '+money(left)+'。');level=level==='danger'?'danger':'warn';}}
      else{const left=remain()-amount;if(left<0){msgs.push('本月总预算超出 '+money(Math.abs(left))+'。');level=level==='danger'?'danger':'warn';}else if(left<=30){msgs.push('购买后本月只剩 '+money(left)+'。');level=level==='danger'?'danger':'warn';}}
    }else{msgs.push('本月预算还没设置。');level=level==='danger'?'danger':'warn';}
  }else{msgs.push('这笔未纳入预算。');level=level==='danger'?'danger':'warn';}
  const bg=level==='danger'?'#fef2f2':level==='warn'?'#fffbeb':'#ecfdf5';
  const col=level==='danger'?'#b91c1c':level==='warn'?'#b45309':'#047857';
  return `<div style="margin-top:4px;padding:10px 12px;border-radius:12px;background:${bg};color:${col};font-size:12.5px;line-height:1.6">${msgs.join(' ')||'在预算范围内。'}</div>`;
}

function txLine(t){

  const color=plus?'#047857':t.type==='expense'?'#b91c1c':'#0d9488';
  const tg=t.tagId?tag(t.tagId):null;
  const generic=!t.item||/^(快速|快捷指令)(支出|收入)$/.test(t.item);
  const title=(generic&&tg)?`<span class="dot" style="background:${tg.color}"></span>${esc(tg.name)}`:esc(t.item||t.type);
  const sub=`${t.date} · ${esc(acc(t.accountId)?.name||'未知账户')}${(tg&&!generic)?' · '+esc(tg.name):''}${refund?' · 退款':''}${t.refunded?' · 已退款':''}`;
  return `<div class="swipe"><button class="swipe-del" type="button" data-del-tx="${t.id}">删除</button><div class="swipe-in"><div class="row">

  </div></div></div>`;
}

function sumState(){
  const u=S.ui;const now=new Date();
  if(!u.sumMode)u.sumMode='month';if(!u.sumYear)u.sumYear=now.getFullYear();if(!u.sumMonth)u.sumMonth=ym(now);
  return u;
}
function calcSummary(mode,year,month){
  const prefix=mode==='year'?String(year):month;
  const txs=S.txs.filter(t=>t.type==='expense'&&!t.refunded&&t.date.startsWith(prefix));
  const total=txs.reduce((a,t)=>a+Number(t.amount),0);
  const now=new Date();let start,end;
  if(mode==='year'){start=new Date(year,0,1);end=new Date(year,11,31);}
  else{const[y,m]=month.split('-').map(Number);start=new Date(y,m-1,1);end=new Date(y,m,0);}
  const lim=end>now?now:end;const days=Math.max(1,Math.floor((lim-start)/86400000)+1);
  const byTag={},byDay={};let maxTx=null;
  txs.forEach(t=>{
    const k=t.tagId||'other';byTag[k]=(byTag[k]||0)+Number(t.amount);
    byDay[t.date]=(byDay[t.date]||0)+Number(t.amount);
    if(Number(t.amount)>0&&(!maxTx||Number(t.amount)>Number(maxTx.amount)))maxTx=t;
  });
  let topDay=null;Object.entries(byDay).forEach(([d,v])=>{if(!topDay||v>topDay[1])topDay=[d,v];});
  const months=mode==='year'?Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`):[month];
  const overMap={};
  months.forEach(mk=>{const bd=S.budgets[mk];if(!bd||!bd.tagLimits)return;Object.keys(bd.tagLimits).forEach(tid=>{const o=spentByTag(tid,mk)-Number(bd.tagLimits[tid]);if(o>0)overMap[tid]=(overMap[tid]||0)+o;});});
  let topOver=null;Object.entries(overMap).forEach(([k,v])=>{if(!topOver||v>topOver[1])topOver=[k,v];});
  return{total,days,count:txs.length,byTag,maxTx,topDay,topOver};
}
function viewSummary(back){

  const mx=R.maxTx;const generic=mx&&(!mx.item||/^(快速|快捷指令)(支出|收入)$/.test(mx.item));
  const mxName=mx?(generic?tag(mx.tagId).name:mx.item):'';
  const title=u.sumMode==='year'?`${u.sumYear} 年`:`${u.sumYear} 年 ${Number(mm)} 月`;
  const body=R.count?`
    <div class="hero" style="margin-bottom:14px">
      <div class="metric"><span>总消费</span><b>${money(R.total)}</b></div>

      <div class="row item"><span class="muted">消费最高那天</span><span style="text-align:right"><b>${R.topDay?money(R.topDay[1]):'-'}</b><div class="muted">${R.topDay?R.topDay[0]:''}</div></span></div>
      <div class="row item"><span class="muted">超额最厉害的标签</span><span style="text-align:right">${R.topOver?`<b style="color:var(--danger)">${esc(tag(R.topOver[0]).name)}</b><div class="muted">超 ${money(R.topOver[1])}</div>`:'<b>没有超额</b>'}</span></div>
    </div>`:`<div class="card"><div class="empty">${title}还没有支出记录</div></div>`;
  return `<div class="section-title"><h2>消费总结</h2>${back}</div>
  <div class="card">
    <div class="segmented"><button type="button" class="qa-type ${u.sumMode==='month'?'active':''}" data-sum-mode="month">月度总结</button><button type="button" class="qa-type ${u.sumMode==='year'?'active':''}" data-sum-mode="year">年度总结</button></div>
    <div class="row" style="margin-top:12px"><button class="ib" type="button" id="sumPrevY">${svgBack()}</button><b>${u.sumYear} 年</b><button class="ib" type="button" id="sumNextY">${svgNext()}</button></div>
    ${grid}
  </div>${body}`;
}

// 月度折线图：按「消费标签」分线
function openMonthChart(month){
  const[y,m]=month.split('-').map(Number);const days=new Date(y,m,0).getDate();
  const map={};
  S.txs.forEach(t=>{
    if(t.type!=='expense'||t.refunded||!t.date.startsWith(month))return;
    const tg=tag(t.tagId);const key=tg.id||'other';
    if(!map[key])map[key]={key,label:tg.name,color:tg.color,data:Array(days).fill(0),total:0};
    const d=Number(t.date.slice(8,10))-1;
    map[key].data[d]+=Number(t.amount);map[key].total+=Number(t.amount);
  });
  const series=Object.values(map).filter(s=>s.total>0).sort((a,b)=>b.total-a.total);
  openModal(`<div class="row"><h3>${month} 各标签支出</h3>${closeBtn()}</div>${series.length?`<canvas id="monthChartCanvas" class="chart-modal-canvas"></canvas><div class="chart-legend" id="chartLegend"></div>`:`<div class="empty">这个月还没有支出记录</div>`}`);
  $('mc').onclick=closeModal;
  if(!series.length)return;
  let sel=null;
  const paint=()=>{
    drawLineChart('monthChartCanvas',sel?series.filter(s=>s.key===sel):series);
    const box=$('chartLegend');
    box.innerHTML=`<button type="button" class="chart-chip ${sel?'':'active'}" data-k="">全部</button>`+series.map(s=>`<button type="button" class="chart-chip ${sel===s.key?'active':''}" data-k="${esc(s.key)}"><i style="background:${s.color}"></i>${esc(s.label)} ${money(s.total)}</button>`).join('');
    box.querySelectorAll('.chart-chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel=(k===''||k===sel)?null:k;paint();});
  };
  paint();
}
function drawLineChart(canvasId,series){
  const canvas=$(canvasId);if(!canvas)return;
  const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();
  const w=rect.width||360,h=rect.height||220;canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  const allVals=series.flatMap(s=>s.data);const max=Math.max(1,...allVals);const days=series[0]?.data.length||30;
  const padL=32,padR=10,padT=10,padB=20;const plotW=w-padL-padR,plotH=h-padT-padB;
  const x=i=>padL+(i/(days-1||1))*plotW;const y=v=>padT+plotH-(Math.max(0,v)/max)*plotH;
  ctx.strokeStyle='#eef0f2';ctx.lineWidth=1;ctx.fillStyle='#9ca3af';ctx.font='9px -apple-system,sans-serif';
  for(let i=0;i<=3;i++){const val=max/3*i;const yy=y(val);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(w-padR,yy);ctx.stroke();ctx.fillText(Math.round(val),2,yy+3);}
  ctx.textAlign='center';[1,Math.round(days/2),days].forEach(d=>{ctx.fillText(d+'日',x(d-1),h-6);});
  series.forEach(s=>{
    if(!s.data.some(v=>v>0))return;
    ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();s.data.forEach((v,i)=>{i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v));});ctx.stroke();
    s.data.forEach((v,i)=>{if(v>0){ctx.beginPath();ctx.arc(x(i),y(v),2.5,0,Math.PI*2);ctx.fill();}});
  });
}

// ---------- 给 AI 的财务快照 ----------
const SNAPSHOT_INTRO='\n\n【用户当前的财务数据】\n以下内容由应用在每次提问时自动附上，是用户此刻在应用各页面里能看到的全部信息（对话框里的其他对话记录你不知道）。请以这份数据为准回答，不要编造这里没有的数字；需要的数据这里没有时，直接说没有。\n';
function buildSnapshot(){
  const L=[];const t0=today();const month=t0.slice(0,7);const b=budget();
  const nm=id=>acc(id)?.name||'未知账户';
  const kindTx=t=>t.type==='income'?'收入':t.type==='expense'?(Number(t.amount)<0?'退款':'支出'):'内部转账';
  L.push('日期：'+t0);
  L.push('【资产】总资产 '+moneyS(totalAssets())+'；当前可安排 '+moneyS(free())+'（=总资产−安全余额−专项）');
  S.accounts.forEach(a=>L.push('- '+a.name+'：余额 '+moneyS(a.balance)+'，其中安全余额 '+moneyS(safeAllocOn(a.id))+'，专项 '+moneyS(goalsOn(a.id))+'，可安排 '+moneyS(accFree(a))));
  L.push('【安全余额】共 '+moneyS(S.settings.safe)+'（各账户分配汇总）');
  L.push('【专项储蓄】合计 '+moneyS(savings())+(S.goals.length?'':'（暂无专项）'));
  S.goals.forEach(g=>{
    const parts=S.accounts.filter(a=>goalAllocOn(g,a.id)>0).map(a=>a.name+' '+moneyS(goalAllocOn(g,a.id)));
    L.push('- '+g.name+'：目标 '+moneyS(g.target)+'，已存 '+moneyS(g.saved)+(parts.length?'；分布：'+parts.join('，'):''));
  });
  const used=spentTotal();
  L.push('【本月预算】'+(b.set?'总预算 '+moneyS(b.total)+'，已花 '+moneyS(used)+'，剩余 '+moneyS(b.total-used):'总预算未设置，本月已花 '+moneyS(used)));
  S.tags.filter(t=>b.tagLimits&&b.tagLimits[t.id]).forEach(t=>{const lim=Number(b.tagLimits[t.id]);const sp=spentByTag(t.id);L.push('- 标签「'+t.name+'」预算 '+moneyS(lim)+'，已花 '+moneyS(sp)+'，剩余 '+moneyS(lim-sp));});
  const byTag=S.tags.map(t=>[t.name,spentByTag(t.id)]).filter(x=>Math.abs(x[1])>0.004);
  if(byTag.length)L.push('本月各标签已花（已扣除退款）：'+byTag.map(x=>x[0]+' '+moneyS(x[1])).join('，'));
  const planLine=p=>'- '+p.item+' '+moneyS(p.amount)+'（标签：'+tag(p.tagId).name+'；日期：'+p.date+'；'+(p.inBudget===false?'未纳入预算':'纳入预算')+(p.note?'；备注：'+String(p.note).slice(0,60):'')+'）';
  const pOpen=S.plans.filter(p=>p.status==='open');
  L.push('【待处理计划】'+(pOpen.length?pOpen.length+' 个':'无'));pOpen.forEach(p=>L.push(planLine(p)));
  const monTxs=S.txs.filter(t=>t.date.startsWith(month)).sort(cmpTx);
  const inc=monTxs.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
  const exp=monTxs.filter(t=>t.type==='expense'&&!t.refunded).reduce((a,t)=>a+Number(t.amount),0);
  L.push('【本月流水】收入合计 '+moneyS(inc)+'，支出合计（已扣退款）'+moneyS(exp)+'，共 '+monTxs.length+' 条'+(monTxs.length>100?'（只列最近 100 条）':''));
  monTxs.slice(0,100).forEach(t=>L.push('- '+t.date+' '+kindTx(t)+' '+moneyS(Math.abs(t.amount))+' '+(t.type==='transfer'?nm(t.accountId)+'→'+nm(t.toAccountId):nm(t.accountId))+(t.type==='expense'&&t.tagId?' 标签:'+tag(t.tagId).name:'')+' '+(t.item||'')+(t.refunded?'（已退款）':'')));
  const[py,pm]=month.split('-').map(Number);const prev=ym(new Date(py,pm-2,1));
  const pmap={};let ptotal=0;
  S.txs.forEach(t=>{if(t.type!=='expense'||t.refunded||!t.date.startsWith(prev))return;const n=tag(t.tagId).name;pmap[n]=(pmap[n]||0)+Number(t.amount);ptotal+=Number(t.amount);});
  const pk=Object.entries(pmap).sort((a,b)=>b[1]-a[1]);
  L.push('【上月('+prev+')支出】'+(pk.length?'合计 '+moneyS(ptotal)+'；各标签：'+pk.map(x=>x[0]+' '+moneyS(x[1])).join('，'):'无记录'));
  return L.join('\n');
}

    const a=acc(b.dataset.bal);if(!a)return;
    miniForm({title:a.name+' 余额',fields:[{key:'v',type:'number',value:a.balance}],onOk:o=>{
      const v=Number(o.v);if(o.v===''||isNaN(v)){toast('金额无效');return false;}

    }});

  document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{
    if(guard(b))return;
    const a=acc(b.dataset.ren);if(!a)return;

    const id=b.dataset.delAcc;
    if(S.accounts.length<=1)return toast('至少保留一个账户');
    if(!confirm('确定删除这个账户吗？相关流水会显示未知账户，它的安全余额分配和专项存入记录也会清掉。'))return;
    S.accounts=S.accounts.filter(a=>a.id!==id);
    if(S.safeAlloc)delete S.safeAlloc[id];
    S.settings.safe=r2(allocSum(S.safeAlloc));
    S.goals.forEach(g=>{g.log=(g.log||[]).filter(x=>x.acc!==id);syncGoal(g);});

// 本月预算：总预算 + 按标签左右滑动的大圆环
function openBudgetPopup(){
  const p=periodKey();const b=budget(p);b.tagLimits=b.tagLimits||{};
  const used=spentTotal(p);const tot=Number(b.total||0);
  const cap=Math.max(0,r2(free()+used));
  const over0=b.set&&used>tot;
  const head=`<button type="button" class="list-btn" style="display:block" data-total><div class="row"><strong>本月总预算</strong><b style="color:var(--text);font-size:17px">${b.set?money(tot):'未设置'} ›</b></div>${b.set?`<div class="progress"><i class="${used>tot?'danger':used>=tot*.85?'warn':''}" style="width:${Math.min(100,Math.max(0,used/Math.max(tot,.01)*100))}%"></i></div>`:''}<div class="muted" style="margin-top:6px">已花 ${money(used)}${over0?' · 超 '+money(used-tot):''} · 上限 ${money(cap)}</div></button>`;
  const C=2*Math.PI*80;
  const ring=t=>{
    const sp=spentByTag(t.id,p),l=Number(b.tagLimits[t.id]||0);const over=l>0&&sp>l;
    const col=over?'#ef4444':t.color;const frac=l>0?Math.min(1,Math.max(0,sp/l)):0;
    const center=over?`<div style="color:#ef4444;font-size:24px;font-weight:800">超 ${money(sp-l)}</div><div class="muted">已花 ${money(sp)} / ${money(l)}</div>`
      :l>0?`<div style="font-size:24px;font-weight:800">剩 ${money(l-sp)}</div><div class="muted">已花 ${money(sp)} / ${money(l)}</div>`
      :`<div style="font-size:24px;font-weight:800">${money(sp)}</div><div class="muted">未设预算</div>`;
    return `<div class="rpg"><button type="button" data-tl="${t.id}" style="border:0;background:transparent;position:relative;width:210px;height:210px;margin:0 auto;display:block;color:inherit;padding:0">
      <svg viewBox="0 0 200 200" width="210" height="210"><circle cx="100" cy="100" r="80" fill="none" stroke="${over?'#fee2e2':'#eef2f1'}" stroke-width="16"/>${frac>0||over?`<circle cx="100" cy="100" r="80" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(over?1:frac)*C} ${C}" transform="rotate(-90 100 100)"/>`:''}</svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">${center}</div></button>
      <div style="text-align:center;margin-top:10px;font-weight:700"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</div></div>`;
  };
  openModal(`<div class="row"><h3>${periodName(p)}预算</h3>${closeBtn()}</div>${head}
    <div class="rpager" id="rpager">${S.tags.map(ring).join('')}</div>
    <div class="pgdots">${S.tags.map((t,i)=>`<i class="pgdot${i?'':' on'}"></i>`).join('')}</div>`);
  $('mc').onclick=closeModal;
  const pager=$('rpager');const dots=document.querySelectorAll('.pgdot');
  pager.addEventListener('scroll',()=>{const i=Math.round(pager.scrollLeft/(pager.clientWidth||1));dots.forEach((d,k)=>d.classList.toggle('on',k===i));});
  const keep=()=>Math.round(pager.scrollLeft/(pager.clientWidth||1));
  const reopen=idx=>{openBudgetPopup();const pg=$('rpager');if(pg)pg.scrollLeft=idx*pg.clientWidth;};
  document.querySelector('[data-total]').onclick=()=>{
    const idx=keep();
    miniForm({title:'本月总预算',note:'不能超过 '+money(cap),fields:[{key:'v',type:'number',value:b.total||''}],onOk:o=>{
      const v=Math.max(0,Number(o.v||0));
      if(v>cap+0.004){toast('预算不能超过可安排上限 '+money(cap));return false;}
      b.total=v;b.set=true;save();render();reopen(idx);
    }});
  };
  document.querySelectorAll('[data-tl]').forEach(btn=>btn.onclick=()=>{
    const tid=btn.dataset.tl;const idx=keep();
    miniForm({title:'「'+tag(tid).name+'」本月预算',note:'留空表示不限',fields:[{key:'v',type:'number',value:b.tagLimits[tid]!=null?b.tagLimits[tid]:''}],onOk:o=>{
      const v=String(o.v).trim();
      if(v!==''&&b.set&&Number(v)>Number(b.total)+0.004){toast('不能超过本月总预算 '+money(b.total));return false;}
      if(v==='')delete b.tagLimits[tid];else b.tagLimits[tid]=Number(v);
      save();render();reopen(idx);
    }});
  });
}

function openGoalsPopup(){
  const head=`<div class="row"><h3>专项储蓄 ${money(savings())}</h3><div style="display:flex;gap:2px;flex:0 0 auto"><button class="ib" type="button" id="addGoalBtn">${svgPlus()}</button>${closeBtn()}</div></div>`;
  const rows=S.goals.map(g=>{
    const pct=g.target>0?Math.min(100,g.saved/g.target*100):0;
    return `<div class="swipe"><button class="swipe-del" type="button" data-del-goal="${g.id}">删除</button><div class="swipe-in" style="padding:0"><button class="list-btn" type="button" style="display:block;border-bottom:0;background:#fff" data-goal="${g.id}"><div class="row"><strong style="color:var(--text)">${esc(g.name)}</strong><span>${money(g.saved)} / ${money(g.target)} ›</span></div><div class="progress"><i style="width:${pct}%"></i></div></button></div></div>`;
  }).join('');
  openModal(head+(S.goals.length?`<div>${rows}</div>`:`<div class="empty">还没有专项项目</div>`));
  $('mc').onclick=closeModal;
  const guard=bindSwipe($('modal'));
  $('addGoalBtn').onclick=()=>miniForm({title:'新建专项',fields:[
    {key:'name',label:'专项名称',placeholder:'比如：新手机'},
    {key:'target',label:'目标金额',type:'number',value:1000}
  ],onOk:o=>{
    const name=o.name.trim();if(!name){toast('填写专项名称');return false;}
    S.goals.push({id:uid(),name,target:Math.max(0,Number(o.target||0)),saved:0,log:[]});save();render();openGoalsPopup();
  }});
  document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{if(guard(b))return;openGoalDetail(b.dataset.goal);});
  document.querySelectorAll('[data-del-goal]').forEach(b=>b.onclick=()=>{
    S.goals=S.goals.filter(x=>x.id!==b.dataset.delGoal);save();render();openGoalsPopup();
  });
}

// 专项详情：进度 + 存入一笔 + 存入记录（左滑取出）
function openGoalDetail(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return openGoalsPopup();
  syncGoal(g);
  const pct=g.target>0?Math.min(100,g.saved/g.target*100):0;
  const rows=g.log.slice().sort((a,b)=>b.ts-a.ts).map(x=>`<div class="swipe"><button class="swipe-del" type="button" data-del-log="${x.id}">取出</button><div class="swipe-in"><div class="row"><div><div class="nm">${esc(acc(x.acc)?.name||'未知账户')}</div><div class="muted">${today(new Date(x.ts))}</div></div><b style="color:#047857">+${money(x.amt)}</b></div></div></div>`).join('');
  openModal(`<div class="row"><button class="ib" type="button" id="goBack">${svgBack()}</button>${closeBtn()}</div>
    <h3 style="margin-top:4px">${esc(g.name)}</h3>
    <div class="row"><b style="font-size:24px">${money(g.saved)}</b><button type="button" class="tap" data-g-target>目标 ${money(g.target)} ›</button></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <button class="btn block" type="button" id="gDep" style="margin:14px 0 6px">＋ 存入一笔</button>
    ${rows||'<div class="empty">还没有存入记录</div>'}`);
  $('mc').onclick=closeModal;
  $('goBack').onclick=()=>{render();openGoalsPopup();};
  bindSwipe($('modal'));
  $('gDep').onclick=()=>miniForm({title:'存入一笔',fields:[
    {key:'acc',label:'从哪个账户',type:'select',value:(S.accounts.find(a=>accFree(a)>0)||S.accounts[0]).id,options:S.accounts.map(a=>[a.id,a.name+' 可安排 '+money(accFree(a))])},
    {key:'v',label:'金额',type:'number'}
  ],onOk:o=>{
    const v=r2(o.v||0);if(!(v>0)){toast('金额无效');return false;}
    const a=acc(o.acc);if(!a)return false;
    if(v>accFree(a)+0.004){toast('该账户可安排不足');return false;}
    g.log.push({id:uid(),acc:a.id,amt:v,ts:Date.now()});syncGoal(g);save();render();openGoalDetail(id);
  }});
  document.querySelector('[data-g-target]').onclick=()=>miniForm({title:'目标金额',fields:[{key:'v',type:'number',value:g.target||''}],onOk:o=>{
    g.target=Math.max(0,r2(o.v||0));save();render();openGoalDetail(id);
  }});
  document.querySelectorAll('[data-del-log]').forEach(b=>b.onclick=()=>{
    g.log=g.log.filter(x=>x.id!==b.dataset.delLog);syncGoal(g);save();render();openGoalDetail(id);
  });
}

function render(){
  setChrome();
  const view={home:viewHome,cal:viewCal,ai:viewAI,settings:viewSettings}[page]||viewHome;
  $('view').innerHTML=view();
  $('view').classList.toggle('ai',page==='ai');
  bind();
  if(page==='ai'){requestAnimationFrame(()=>{const box=$('chatBox');if(box)box.scrollTop=box.scrollHeight;});}
}

function bind(){
  if(page==='home'){
    $('goBudget').onclick=()=>openBudgetPopup();
    document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>openMetric(b.dataset.metric));
    document.querySelectorAll('[data-del-plan]').forEach(b=>b.onclick=()=>{deletePlan(b.dataset.delPlan);render();});
    document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{page='ai';render();await reviewPlan(b.dataset.review);});
  }
  if(page==='cal'){
    $('prevM').onclick=()=>{const[y,m]=S.ui.month.split('-').map(Number);S.ui.month=ym(new Date(y,m-2,1));S.ui.calDay=null;save();render();};
    $('nextM').onclick=()=>{const[y,m]=S.ui.month.split('-').map(Number);S.ui.month=ym(new Date(y,m,1));S.ui.calDay=null;save();render();};
    $('monthChartBtn').onclick=()=>openMonthChart(S.ui.month||ym(new Date()));
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.ui.calDay=S.ui.calDay===b.dataset.day?null:b.dataset.day;save();render();});
    const cd=$('clearDay');if(cd)cd.onclick=()=>{S.ui.calDay=null;save();render();};
    document.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{S.ui.calFilter=S.ui.calFilter===b.dataset.fl?null:b.dataset.fl;save();render();});
    bindSwipe($('view'));
    document.querySelectorAll('[data-del-tx]').forEach(b=>b.onclick=()=>{
      if(!confirm('确定删除这条流水吗？账户余额会自动改回去。'))return;
      const t=S.txs.find(x=>x.id===b.dataset.delTx);if(!t)return;
      if(t.type==='transfer'){const from=acc(t.accountId),to=acc(t.toAccountId);if(from)from.balance=r2(from.balance+t.amount);if(to)to.balance=r2(to.balance-t.amount);}
      else if(!t.refunded){const a=acc(t.accountId);if(a)a.balance=r2(a.balance+(t.type==='income'?-t.amount:t.amount));}
      S.txs=S.txs.filter(x=>x.id!==t.id);save();render();
    });
  }
  if(page==='ai'){
    $('ai_send').onclick=sendChat;
    const aiInput=$('ai_input');
    aiInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
    aiInput.addEventListener('input',()=>{aiInput.style.height='46px';aiInput.style.height=Math.min(aiInput.scrollHeight,110)+'px';});
    $('ai_plan').addEventListener('change',async e=>{const id=e.target.value;if(!id)return;e.target.value='';if(aiBusy)return toast('AI 正在回复，请稍等');await reviewPlan(id);});
    $('clearChat').onclick=()=>{if(!confirm('清空当前对话？'))return;curSession().chat=[];save();render();};
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const s=curSession();const m=s.chat[+b.dataset.copy];if(!m)return;try{await navigator.clipboard.writeText(m.text);toast('已复制');}catch{prompt('复制',m.text);}});
    document.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{splitContext(+b.dataset.split);});
    document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{retryReply(+b.dataset.retry);});
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
      const s=curSession();const i=+b.dataset.edit;const m=s.chat[i];if(!m)return;
      miniForm({title:'编辑消息',fields:[{key:'t',type:'textarea',value:m.text}],onOk:o=>{m.text=o.t;save();render();}});
    });
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=curSession();s.chat.splice(+b.dataset.del,1);save();render();});
  }
  if(page==='settings'){
    document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{S.ui.setPanel=b.dataset.panel;save();render();});
    const back=$('setBack');if(back)back.onclick=()=>{S.ui.setPanel=null;save();render();};
    bindSettingsPanel();
  }
}

function bindSettingsPanel(){
  const p=S.ui.setPanel;if(!p)return;
  if(p==='tags'){
    $('addTag').onclick=()=>{
      const autoColor=nextTagColor();
      openModal(`<div class="row"><h3>新增标签</h3>${closeBtn()}</div>
        <label class="field" style="margin-top:8px"><span>名称</span><input id="nt_name" placeholder="比如：宠物用品"></label>
        <div class="kv"><span>颜色</span><input id="nt_color" type="color" value="${autoColor}"></div>
        <button class="btn block" type="button" id="nt_ok" style="margin-top:10px">保存</button>`);
      $('mc').onclick=closeModal;
      $('nt_ok').onclick=()=>{const name=$('nt_name').value.trim();if(!name)return toast('填写标签名称');S.tags.push({id:uid(),name,color:$('nt_color').value,over:false,quiz:true,cool:0});save();closeModal();render();};
    };
    document.querySelectorAll('[data-edit-tag]').forEach(b=>b.onclick=()=>{
      const t=tag(b.dataset.editTag);
      openModal(`<div class="row"><h3>编辑标签</h3>${closeBtn()}</div>
        <label class="field" style="margin-top:8px"><span>名称</span><input id="et_name" value="${esc(t.name)}"></label>
        <div class="kv"><span>颜色</span><input id="et_color" type="color" value="${t.color}"></div>
        <button class="btn block" type="button" id="et_ok" style="margin-top:10px">保存</button>`);
      $('mc').onclick=closeModal;
      $('et_ok').onclick=()=>{t.name=$('et_name').value.trim()||t.name;t.color=$('et_color').value;t.quiz=true;save();closeModal();render();};
    });
    document.querySelectorAll('[data-del-tag]').forEach(b=>b.onclick=()=>{
      if(S.tags.length<=1)return toast('至少保留一个标签');if(!confirm('确定删除这个标签吗？相关流水和计划会转到"其他"。'))return;
      const other=S.tags.find(t=>t.id==='other'&&t.id!==b.dataset.delTag)||S.tags.find(t=>t.id!==b.dataset.delTag);
      S.txs.forEach(t=>{if(t.tagId===b.dataset.delTag)t.tagId=other.id;});S.plans.forEach(p=>{if(p.tagId===b.dataset.delTag)p.tagId=other.id;});
      S.tags=S.tags.filter(t=>t.id!==b.dataset.delTag);save();render();
    });
  }
  if(p==='model'){
    $('saveModel').onclick=()=>{S.settings.modelOn=$('m_on').checked;S.api.baseURL=$('m_url').value.trim();S.api.apiKey=$('m_key').value.trim();S.api.model=$('m_model').value;S.api.timeout=Number($('m_timeout').value||30000);save();toast('已保存');};
    $('clearModel').onclick=()=>{if(!confirm('确定清除本地保存的URL、Key和模型选择吗？'))return;S.api.baseURL='';S.api.apiKey='';S.api.models=[];S.settings.modelOn=false;save();toast('已清除');render();};
    $('pullModels').onclick=async()=>{
      S.api.baseURL=$('m_url').value.trim();S.api.apiKey=$('m_key').value.trim();$('m_msg').textContent='拉取中…';
      try{const res=await fetch(S.api.baseURL.replace(/\/$/,'')+'/models',{headers:{Authorization:'Bearer '+S.api.apiKey}});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();S.api.models=(data.data||[]).map(x=>x.id).filter(Boolean);if(S.api.models.length&&!S.api.models.includes(S.api.model))S.api.model=S.api.models[0];save();$('m_msg').textContent='已拉取 '+S.api.models.length+' 个模型';render();}
      catch(e){if(/Failed to fetch|NetworkError/i.test(String(e.message||e)))$('m_msg').textContent='当前API服务不支持浏览器直接访问，需要更换支持浏览器调用的接口，或使用自己的代理服务。';else $('m_msg').textContent='拉取失败：'+e.message;}
    };
    $('testModel').onclick=async()=>{
      S.settings.modelOn=true;S.api.baseURL=$('m_url').value.trim();S.api.apiKey=$('m_key').value.trim();S.api.model=$('m_model').value;$('m_msg').textContent='测试中…';const start=Date.now();
      try{const t=await callAI([{role:'user',content:'只回复：连接成功'}]);$('m_msg').textContent=`连接成功 · 耗时${Date.now()-start}ms · 模型：${S.api.model} · 返回：`+String(t).slice(0,40);}
      catch(e){$('m_msg').textContent='错误：'+e.message;}
    };
    $('restorePrompt').onclick=()=>{$('m_prompt').value=PROMPT;};
    $('savePrompt').onclick=()=>{S.api.prompt=$('m_prompt').value;save();toast('提示词已保存');};
  }
  if(p==='summary')bindSummary();
  if(p==='data'){
    $('exportJson').onclick=()=>{const dump=JSON.parse(JSON.stringify(S));dump.api.apiKey='';const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='清醒消费备份-'+today()+'.json';a.click();toast('已导出');};
    $('exportCsv').onclick=()=>{const header=['日期','类型','金额','账户','标签','用途','备注'];const rows=S.txs.map(t=>[t.date,t.type==='income'?'收入':t.type==='expense'?(Number(t.amount)<0?'退款':'支出'):'内部转账',Math.abs(t.amount),acc(t.accountId)?.name||'',t.tagId?tag(t.tagId).name:'',t.item||'',t.note||'']);const csv=[header,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='流水导出-'+today()+'.csv';a.click();toast('已导出');};
    $('importJsonBtn').onclick=()=>$('importJson').click();
    $('importJson').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const accCount=(data.accounts||[]).length,txCount=(data.txs||[]).length;if(!confirm(`文件包含 ${accCount} 个账户，${txCount} 条流水。导入将覆盖当前全部数据，继续？`)){e.target.value='';return;}const base=DEFAULT();S=Object.assign(base,data,{settings:Object.assign(base.settings,data.settings||{}),api:Object.assign(base.api,data.api||{}),ui:Object.assign(base.ui,data.ui||{})});if(!Array.isArray(S.tags)||!S.tags.length)S.tags=DEFAULT_TAGS();S.tags.forEach(t=>{t.quiz=true;});if(!Array.isArray(S.sessions)||!S.sessions.length){S.sessions=[{id:'s0',name:'对话 1',chat:[],createdAt:Date.now()}];S.ui.curSession='s0';}migrate(S);save();e.target.value='';toast('导入完成');render();}catch(err){e.target.value='';toast('导入失败：文件格式不对');}};
    $('clearTxOnly').onclick=()=>{if(!confirm('确定清空所有流水吗？这不会自动恢复账户余额，建议先导出备份。'))return;S.txs=[];save();toast('流水已清空');render();};
    $('resetAll').onclick=()=>{if(!confirm('确定恢复初始吗？当前全部数据会被覆盖，建议先导出备份。'))return;S=DEFAULT();save();toast('已恢复');render();};
  }
}

$('nav').addEventListener('click',e=>{
  const act=e.target.closest('button[data-act]');
  if(act){openAddSheet('rec');return;}
  const btn=e.target.closest('button[data-page]');if(!btn)return;
  page=btn.dataset.page;if(page!=='settings')S.ui.setPanel=null;save();render();
});

function handleQuickAddURL(){
  const params=new URLSearchParams(location.search);const type=params.get('quickadd');
  if(type!=='expense'&&type!=='income')return false;
  const amount=Number(params.get('amount')||0);const note=(params.get('note')||'').slice(0,60);
  const accParam=params.get('account')||'';const tagParam=params.get('tag')||'';
  history.replaceState(null,'',location.pathname);
  if(!(amount>0)){renderQuickAddResult(false,'金额无效，没有记录任何内容。');return true;}
  let account=S.accounts.find(a=>a.id===accParam||a.name===accParam)||S.accounts[0];
  if(!account){renderQuickAddResult(false,'没有可用账户。');return true;}
  let tagObj=null;
  if(type==='expense')tagObj=S.tags.find(t=>t.id===tagParam||t.name===tagParam)||S.tags.find(t=>t.id==='other')||S.tags[0];
  if(type==='expense'){account.balance=r2(account.balance-amount);S.txs.unshift({id:uid(),ts:Date.now(),type:'expense',amount,accountId:account.id,tagId:tagObj?.id,item:note||'快捷指令支出',date:today(),note,refunded:false});}
  else{account.balance=r2(account.balance+amount);S.txs.unshift({id:uid(),ts:Date.now(),type:'income',amount,accountId:account.id,item:note||'快捷指令收入',date:today(),note,refunded:false});}
  save();
  renderQuickAddResult(true,`已记录 ${type==='expense'?'支出':'收入'} ${money(amount)}${note?'，'+esc(note):''}（${esc(account.name)}）`);
  return true;
}
function renderQuickAddResult(ok,message){
  document.body.innerHTML=`<div style="max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:${ok?'#f7f8f8':'#fef2f2'}"><div style="width:64px;height:64px;border-radius:50%;background:${ok?'#0d9488':'#dc2626'};display:flex;align-items:center;justify-content:center;margin-bottom:16px"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" style="width:32px;height:32px">${ok?'<path d="M20 6L9 17l-5-5"/>':'<path d="M18 6L6 18M6 6l12 12"/>'}</svg></div><div style="font-size:16px;font-weight:600;color:#111827;line-height:1.6">${message}</div><a href="index.html" style="margin-top:20px;color:#0d9488;font-size:13px;font-weight:600;text-decoration:none">打开完整应用 ›</a></div>`;
}

if(!handleQuickAddURL()){render();}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
