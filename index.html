<title>清醒消费</title>
<style>
:root{
  --bg:#f7f8f8; --card:#fff; --text:#111827; --muted:#6b7280; --line:#eef0f2;
  --brand:#0d9488; --brand-soft:#ecfdf5; --danger:#dc2626; --warn:#d97706;
  --radius:18px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.04);
  --nav:64px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + var(--safe) + 12px)}
.top{padding:18px 20px 8px;position:sticky;top:0;background:rgba(247,248,248,.92);backdrop-filter:blur(12px);z-index:10}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.main{padding:8px 16px 20px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.soft{background:linear-gradient(180deg,#fff, #f9fffd);border:1px solid #e6f7f3}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:12px;border-radius:14px;background:#f9fafb}
.metric b{display:block;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.section-title h2{margin:0;font-size:15px;font-weight:650}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:#fff;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.line{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#fef2f2;color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,select,textarea{

<script>
const KEY = 'sober_wallet_v3';
const PROMPT = `你是一名理性、温和、注重预算边界的个人消费决策助手。你的任务不是鼓励用户消费，也不是否定一切非必要消费，而是帮助用户区分必要消费、合理改善、快乐消费、功能升级、重复购买、促销诱导和过量囤货。
优先检查商品是否解决真实问题、是否已经存在替代品、是否符合预算、是否触碰安全余额、是否因平台推荐或优惠而被放大吸引力。
允许预算内的快乐消费，但不允许用储蓄、安全余额、固定支出资金或其他必要预算弥补快乐预算超额。
不羞辱用户，不使用"你太浪费""你不自律"等评价。发现消费理由不充分时，应清楚说明缺少什么证据，并建议具体冷静期。
对正常吃饭、必要交通、消耗品补充等真实需求，不应施加不必要的道德压力。
你的结论必须简明、明确、可执行，按以下结构回复：1.主要购买理由 2.当前最可能影响判断的因素 3.购买的真实收益 4.不购买的实际损失 5.建议 6.建议等待时间。`;

const DEFAULT_TAGS = () => ([
  {id:'fixed', name:'固定支出', color:'#475569', over:false, quiz:false, cool:0},
  {id:'daily', name:'日常生活', color:'#0d9488', over:false, quiz:false, cool:0},
  {id:'temp', name:'临时必要', color:'#0891b2', over:true, quiz:false, cool:0},
  {id:'meal', name:'正常吃饭', color:'#16a34a', over:true, quiz:false, cool:0},
  {id:'takeout', name:'外卖', color:'#f59e0b', over:false, quiz:false, cool:0},
  {id:'snack', name:'零食饮料', color:'#db2777', over:false, quiz:true, cool:7},
  {id:'consumable', name:'消耗品', color:'#7c3aed', over:false, quiz:false, cool:0},
  {id:'upgrade', name:'功能升级', color:'#c2410c', over:false, quiz:true, cool:14},
  {id:'stock', name:'囤货', color:'#a16207', over:false, quiz:true, cool:7},
  {id:'hobby', name:'兴趣手工', color:'#0ea5e9', over:false, quiz:true, cool:7},
  {id:'fun', name:'娱乐', color:'#dc2626', over:false, quiz:true, cool:7},
  {id:'gift', name:'礼物', color:'#e11d48', over:false, quiz:false, cool:0},
  {id:'other', name:'其他', color:'#94a3b8', over:true, quiz:true, cool:7}
]);

const DEFAULT = () => ({
  settings: {
    safe: 2000,
    quizAmount: 25,
    modelOn: false
  },
  api: {
    baseURL: 'https://api.openai.com/v1',
    apiKey: '',
    model: 'gpt-4o-mini',
    models: [],
    timeout: 30000,
    prompt: PROMPT
  },
  accounts: [
    {id:'cash', kind:'cash', name:'现金', balance:0, note:''},
    {id:'wechat', kind:'wechat', name:'微信', balance:0, note:'微信零钱'},
    {id:'alipay', kind:'alipay', name:'支付宝', balance:0, note:'支付宝余额'},
    {id:'bank', kind:'bank', name:'银行卡', balance:0, note:'主银行卡'}
  ],
  tags: DEFAULT_TAGS(),
  longTags: [],
  budgets: {},
  goals: [],
  plans: [],
  txs: [],
  sessions: [{id:'s0', name:'对话 1', chat:[], createdAt:Date.now()}],
  ui: { month: ym(new Date()), setPanel: null, calDay: null, curSession: 's0' }
});

const KIND_LABEL = { cash:'现金', wechat:'微信', alipay:'支付宝', bank:'银行卡', custom:'自定义' };

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-2)}
function today(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function ym(d){return today(d).slice(0,7)}
function money(n){return '¥' + Number(n||0).toFixed(2).replace(/\.00$/,'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]))}
function periodKey(date=today()){const d=+date.slice(8);return date.slice(0,7)+(d<=15?'-A':'-B')}
function periodName(k){
  const [y,m,half]=[k.slice(0,4),k.slice(5,7),k.slice(8)];
  return half==='A' ? `${Number(m)}月1–15日` : `${Number(m)}月16–底`;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return DEFAULT();
    const parsed = JSON.parse(raw);
    const base = DEFAULT();
    const merged = Object.assign(base, parsed, {
      settings: Object.assign(base.settings, parsed.settings||{}),
      api: Object.assign(base.api, parsed.api||{}),
      ui: Object.assign(base.ui, parsed.ui||{}),
      tags: Array.isArray(parsed.tags) && parsed.tags.length ? parsed.tags : base.tags,
      longTags: Array.isArray(parsed.longTags) ? parsed.longTags : []
    });
    // migrate legacy flat chat[] into sessions[]
    if(Array.isArray(parsed.chat) && parsed.chat.length && (!Array.isArray(parsed.sessions) || !parsed.sessions.length)){
      merged.sessions = [{id:'s0', name:'对话 1', chat:parsed.chat, createdAt:Date.now()}];
      merged.ui.curSession = 's0';
    } else if(!Array.isArray(merged.sessions) || !merged.sessions.length){
      merged.sessions = [{id:'s0', name:'对话 1', chat:[], createdAt:Date.now()}];
      merged.ui.curSession = 's0';
    }
    if(!merged.ui.curSession || !merged.sessions.find(s=>s.id===merged.ui.curSession)){
      merged.ui.curSession = merged.sessions[0].id;
    }
    return merged;
  }catch{ return DEFAULT(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

let S = load();
let page = 'home';

const $ = id => document.getElementById(id);
function toast(t){
  const el=$('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800);
}
function openModal(html){ $('modal').className='modal'; $('modal').innerHTML=html; $('mask').classList.remove('hidden'); }
function openSheet(html){ $('modal').className='sheet-modal'; $('modal').innerHTML=html; $('mask').classList.remove('hidden'); }
function closeModal(){ $('mask').classList.add('hidden'); $('modal').innerHTML=''; $('modal').className='modal'; }
$('mask').addEventListener('click', e => { if(e.target.id==='mask') closeModal(); });

function totalAssets(){ return S.accounts.reduce((a,b)=>a+Number(b.balance||0),0); }
function savings(){ return S.goals.reduce((a,b)=>a+Number(b.saved||0),0); }
function free(){ return totalAssets() - Number(S.settings.safe||0) - savings(); }
function budget(p=periodKey()){ if(!S.budgets[p]) S.budgets[p]={total:0, set:false, tagLimits:{}}; return S.budgets[p]; }
function spentTotal(p=periodKey()){
  return S.txs.filter(t=>t.type==='expense' && !t.refunded && periodKey(t.date)===p)
    .reduce((a,b)=>a+Number(b.amount||0),0);
}
function spentByTag(tagId, p=periodKey()){
  return S.txs.filter(t=>t.type==='expense' && !t.refunded && t.tagId===tagId && periodKey(t.date)===p)
    .reduce((a,b)=>a+Number(b.amount||0),0);
}
function remain(p=periodKey()){ const b=budget(p); return b.set ? Number(b.total)-spentTotal(p) : null; }
function acc(id){ return S.accounts.find(a=>a.id===id); }
function tag(id){ return S.tags.find(t=>t.id===id) || S.tags.find(t=>t.id==='other') || {id:'', name:'其他', color:'#94a3b8'}; }
function guessKind(name){
  const n=String(name||'');
  if(n.includes('现金')) return 'cash';
  if(n.includes('微信')) return 'wechat';
  if(n.includes('支付宝')) return 'alipay';
  if(n.includes('卡')||n.includes('银行')) return 'bank';
  return 'custom';
}
function nextTagColor(){
  // golden-angle hue rotation keeps consecutive colors maximally distinct
  const hue = (S.tags.length * 137.508) % 360;
  return hslToHex(hue, 62, 46);
}
function hslToHex(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

async function callAI(messages, onDelta){
  if(!S.settings.modelOn) throw new Error('请先在"我的-模型 API"中启用模型');
  if(!S.api.baseURL || !S.api.apiKey) throw new Error('请先填写 Base URL 和 API Key');
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), S.api.timeout||30000);
  try{
    const res = await fetch(S.api.baseURL.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+S.api.apiKey },
      body: JSON.stringify({
        model: S.api.model,
        temperature: 0.4,
        stream: !!onDelta,
        messages: [{role:'system', content:S.api.prompt||PROMPT}, ...messages]
      }),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP '+res.status);

    if(!onDelta || !res.body){
      const data = await res.json();
      return data.choices?.[0]?.message?.content || '';
    }

    // stream SSE chunks
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', full = '';
    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        const trimmed = line.trim();
        if(!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if(payload === '[DONE]') continue;
        try{
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content || '';
          if(delta){ full += delta; onDelta(full); }
        }catch{}
      }
    }
    return full;
  }catch(e){
    if(e.name==='AbortError') throw new Error('请求超时');
    if(/Failed to fetch|NetworkError|CORS/i.test(String(e.message||e)))
      throw new Error('当前API服务不支持浏览器直接访问，需要更换支持浏览器调用的接口，或使用自己的代理服务。');
    throw e;
  }finally{ clearTimeout(t); }
}

function needQuiz(plan){
  const t = tag(plan.tagId);
  if(Number(plan.amount) > Number(S.settings.quizAmount||25)) return true;
  if(t?.quiz) return true;
  // 条件二：距预算上限不足¥30
  const b = budget();
  if(b.set){
    const tagLimit = b.tagLimits?.[plan.tagId];
    if(tagLimit){
      const left = Number(tagLimit) - spentByTag(plan.tagId) - Number(plan.amount);
      if(left <= 30) return true;
    } else {
      const left = remain() - Number(plan.amount);
      if(left!=null && left <= 30) return true;
    }
  }
  return false;
}

function createPlan(data){
  const plan = {
    id: uid(), status:'open', amount:Number(data.amount), tagId:data.tagId,
    accountId:data.accountId, item:data.item, date:data.date||today(),
    note:data.note||'', inBudget:data.inBudget!==false, quiz:false, createdAt:Date.now()
  };
  plan.quiz = needQuiz(plan);
  S.plans.unshift(plan); save();
  return plan;
}

const QUIZ_CHOICE = [
  {q:'这件商品主要解决什么问题？', opts:['解决明确的实际问题','让现有的东西更好用一些','单纯喜欢/想要','说不清楚']},
  {q:'目前是否已经拥有相同或类似功能的物品？', opts:['没有，完全空白','有，但明显不够用','有，凑合能用','有，其实够用']},
  {q:'不购买会不会影响正常生活？', opts:['会，比较明显','有一点，但不严重','基本不影响']},
  {q:'预计未来一个月会使用多少次？', opts:['几乎每天','每周几次','偶尔一两次','说不好']},
  {q:'当前购买欲是否受到优惠、赠品、拼团或推荐影响？', opts:['是，影响很大','有一些影响','没有，是自己主动想买']},
  {q:'如果没有优惠，是否仍然愿意原价购买？', opts:['愿意','会犹豫','不愿意']},
  {q:'商品不合适时是否可以退货？', opts:['可以，很方便','可以，但麻烦','不可以/不确定']},
  {q:'购买后是否会挤占其他预算？', opts:['不会','会挤占一点','会明显挤占']},
  {q:'是否可以等待七天再决定？', opts:['可以，不着急','有点难，想尽快买','不可以，有时效性']}
];
const QUIZ_OPEN = [
  '请描述你实际会在什么场景中使用它。',
  '如果是升级/换新，新的东西比现有的具体多了什么功能？',
  '你现在需要的是这个商品本身，还是"买东西"带来的满足感？'
];

function buildQuiz(){
  // pick all fixed choice questions + 2 open ones (per original spec: 2-3 open questions)
  return { choice: QUIZ_CHOICE, open: QUIZ_OPEN.slice(0,2) };
}

function confirmPlan(id){
  const p = S.plans.find(x=>x.id===id); if(!p || p.status!=='open') return;
  if(p.quiz && !p.quizDone){ openQuiz(id); return; }
  doConfirmPlan(id);
}

function doConfirmPlan(id){
  const p = S.plans.find(x=>x.id===id); if(!p) return;
  const a = acc(p.accountId); if(!a) return toast('账户不存在');
  if(Number(a.balance) < Number(p.amount) && !confirm('该账户余额不足，仍要入账吗？')) return;
  a.balance = Number(a.balance) - Number(p.amount);
  S.txs.unshift({
    id:uid(), type:'expense', amount:Number(p.amount), accountId:p.accountId,
    tagId:p.tagId, item:p.item, date:p.date, note:p.note||'', refunded:false, planId:p.id
  });
  p.status='done'; save();
  toast(totalAssets() < S.settings.safe ? '已入账（已低于安全余额）' : '已确认购买');
}

function openQuiz(id){
  const p = S.plans.find(x=>x.id===id); if(!p) return;
  const quiz = buildQuiz();
  const choiceHTML = quiz.choice.map((item,qi)=>`
    <div class="field">
      <span>${qi+1}. ${esc(item.q)}</span>
      <div class="pillbar" style="flex-wrap:wrap" data-quiz-choice="${qi}">
        ${item.opts.map((o,oi)=>`<button type="button" class="quiz-opt" data-qi="${qi}" data-oi="${oi}">${esc(o)}</button>`).join('')}
      </div>
    </div>`).join('');
  const openHTML = quiz.open.map((q,i)=>`
    <label class="field"><span>${quiz.choice.length+i+1}. ${esc(q)}</span>
      <textarea data-quiz-open="${i}" placeholder="简单写几句就行"></textarea>
    </label>`).join('');
  openModal(`<div class="row"><h3>买之前，先想清楚几点</h3><button class="btn sm line" type="button" id="mc">关闭</button></div>
    <p class="muted" style="margin-bottom:12px">${esc(p.item)} · ${money(p.amount)}。回答完会给你一个参考结论，最终决定权在你。</p>
    <div id="quizBody">${choiceHTML}${openHTML}</div>
    <button class="btn block" type="button" id="quizSubmit" style="margin-top:8px">看结论</button>`);
  $('mc').onclick=closeModal;
  document.querySelectorAll('.quiz-opt').forEach(b=>b.onclick=()=>{
    const qi=b.dataset.qi;
    document.querySelectorAll(`.quiz-opt[data-qi="${qi}"]`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
  $('quizSubmit').onclick=()=>{
    const answers = { choice:{}, open:{} };
    let unanswered = 0;
    quiz.choice.forEach((item,qi)=>{
      const picked = document.querySelector(`.quiz-opt[data-qi="${qi}"].active`);
      if(picked) answers.choice[qi] = item.opts[+picked.dataset.oi];
      else unanswered++;
    });
    quiz.open.forEach((q,i)=>{
      answers.open[i] = document.querySelector(`[data-quiz-open="${i}"]`).value.trim();
    });
    if(unanswered > 3) return toast('还有不少题没答，尽量都选一下');
    p.quizAnswers = answers; p.quizDone = true; save();
    showQuizResult(id, answers);
  };
}

function showQuizResult(id, answers){
  const p = S.plans.find(x=>x.id===id); if(!p) return;
  const t = tag(p.tagId);
  let riskScore = 0;
  const flags = [];
  if(answers.choice[0] && (answers.choice[0]==='单纯喜欢/想要'||answers.choice[0]==='说不清楚')){ riskScore++; flags.push('没说清楚解决什么具体问题'); }
  if(answers.choice[1] && (answers.choice[1]==='有，凑合能用'||answers.choice[1]==='有，其实够用')){ riskScore++; flags.push('已有同类物品，可能是重复购买'); }
  if(answers.choice[4] && answers.choice[4]==='是，影响很大'){ riskScore++; flags.push('购买欲主要受促销/推荐影响'); }
  if(answers.choice[5] && answers.choice[5]==='不愿意'){ riskScore++; flags.push('没有优惠就不想买，说明可能只是被优惠吸引'); }
  if(answers.choice[8] && answers.choice[8]==='可以，不着急'){ /* ok to wait, not a risk flag */ }
  const b = budget(); const left = remain();
  const overBudget = b.set && left!=null && Number(p.amount) > left;
  const overSafe = totalAssets() - p.amount < S.settings.safe;

  let verdict, verdictClass;
  if(overSafe){ verdict='不建议现在买：会触碰安全余额'; verdictClass='danger'; }
  else if(overBudget){ verdict='不建议现在买：已超本半月预算'; verdictClass='danger'; }
  else if(riskScore>=3){ verdict='建议先等 '+(t.cool||7)+' 天，证据还不够充分'; verdictClass='warn'; }
  else if(riskScore>=1){ verdict='可以买，但建议先缩小规格或数量'; verdictClass='warn'; }
  else{ verdict='在预算内，理由也比较充分，可以购买'; verdictClass='ok'; }

  const bg = verdictClass==='danger'?'#fef2f2':verdictClass==='warn'?'#fffbeb':'#ecfdf5';
  const col = verdictClass==='danger'?'#b91c1c':verdictClass==='warn'?'#b45309':'#047857';

  openModal(`<div class="row"><h3>参考结论</h3><button class="btn sm line" type="button" id="mc">关闭</button></div>
    <div style="padding:12px 14px;border-radius:12px;background:${bg};color:${col};font-weight:600;margin-bottom:12px">${verdict}</div>
    ${flags.length?`<p class="muted" style="margin-bottom:12px">观察到：${flags.join('；')}。</p>`:''}
    <p class="muted" style="margin-bottom:14px">这只是基于你刚才的回答给出的参考，不是强制规则，最终决定权在你自己。</p>
    <div class="stack">
      <button class="btn" type="button" id="quizGoBuy">仍然确认购买</button>
      <button class="btn line" type="button" id="quizGoCool">进入冷静期</button>
      <button class="btn line" type="button" id="quizGoAsk">带着这些回答去问 AI</button>
    </div>`);
  $('mc').onclick=closeModal;
  $('quizGoBuy').onclick=()=>{ closeModal(); doConfirmPlan(id); render(); };
  $('quizGoCool').onclick=()=>{ closeModal(); cooldownPlan(id, t.cool||7); render(); };
  $('quizGoAsk').onclick=()=>{
    closeModal();
    const choiceText = Object.entries(answers.choice).map(([qi,a])=>`- ${QUIZ_CHOICE[qi].q}：${a}`).join('\n');
    const openText = Object.entries(answers.open).map(([i,a])=>a?`- ${QUIZ_OPEN[i]}：${a}`:'').filter(Boolean).join('\n');
    page='ai'; render();
    askAI(`我在纠结要不要买"${p.item}"（${money(p.amount)}），问卷回答如下：\n${choiceText}\n${openText}\n请结合这些回答给建议。`);
  };
}

function dropPlan(id){
  const p=S.plans.find(x=>x.id===id); if(!p) return;
  p.status='drop'; save(); toast('已放弃');
}
function delayPlan(id){
  const p=S.plans.find(x=>x.id===id); if(!p) return;
  p.status='delay'; save(); toast('已延后');
}
function cooldownPlan(id, days){
  const p=S.plans.find(x=>x.id===id); if(!p) return;
  p.status='cooldown'; p.coolUntil = Date.now() + Number(days||7)*86400000; p.coolDays=Number(days||7); save();
  toast('已进入冷静期 '+days+' 天');
}
function deletePlan(id){
  S.plans = S.plans.filter(x=>x.id!==id); save(); toast('已删除');
}
function doRefund(id){
  const t=S.txs.find(x=>x.id===id); if(!t||t.refunded) return;
  const a=acc(t.accountId); if(a) a.balance+=Number(t.amount);
  t.refunded=true; save(); toast('已退款'); render();
}

function localReview(p){
  const b = budget();
  const left = remain();
  const t = tag(p.tagId);
  const overSafe = Number(totalAssets()-p.amount) < S.settings.safe;
  const overBudget = b.set && left!=null && Number(p.amount)>left;
  const lines = [
    '主要购买理由：' + (p.note || p.item),
    '当前最可能影响判断的因素：是否受促销/赠品/拼团影响，是否已有同类物品，需要你自己再确认一次。',
    '购买的真实收益：能清楚说出解决什么具体问题，就比较值得买；只是"看着心动"就要打个问号。',
    '不购买的实际损失：如果只是一时的心情波动，损失通常很小；如果真的会影响正常生活，损失才算实际。',
    '建议：' + (overBudget ? '已超本半月剩余预算，不建议现在买' :
      (overSafe ? '会触碰安全余额，不建议现在买' :
      (p.quiz ? '证据还不够充分，建议先等一等或缩小规格' : '在预算内，可以正常购买'))),
    '建议等待时间：' + ((t?.cool || (p.quiz?7:0)) + ' 天')
  ];
  return lines.join('\n');
}

function curSession(){
  let s = S.sessions.find(x=>x.id===S.ui.curSession);
  if(!s){ s = S.sessions[0]; S.ui.curSession = s.id; }
  return s;
}
function newSession(){
  const n = S.sessions.length+1;
  const s = {id:uid(), name:'对话 '+n, chat:[], createdAt:Date.now()};
  S.sessions.unshift(s); S.ui.curSession = s.id; save();
  return s;
}
function switchSession(id){ S.ui.curSession = id; save(); }
function deleteSession(id){
  if(S.sessions.length<=1){ 
    const s=curSession(); s.chat=[]; save(); return;
  }
  S.sessions = S.sessions.filter(s=>s.id!==id);
  if(S.ui.curSession===id) S.ui.curSession = S.sessions[0].id;
  save();
}
function renameSession(id, name){
  const s = S.sessions.find(x=>x.id===id); if(s && name.trim()) s.name = name.trim();
  save();
}
function splitContext(i){
  // insert a divider marker right after message i; everything before the LAST divider is excluded from AI context
  const s = curSession();
  s.chat.splice(i+1, 0, {role:'divider', at:Date.now()});
  save(); render();
}
function contextSince(chat){
  // find the last divider, only use messages after it
  let start = 0;
  for(let i=chat.length-1;i>=0;i--){ if(chat[i].role==='divider'){ start=i+1; break; } }
  return chat.slice(start).filter(m=>m.role!=='divider');
}

async function sendChat(){
  const input=$('ai_input'); const text=input.value.trim(); if(!text) return;
  input.value='';
  const s = curSession();
  s.chat.push({role:'user', text, at:Date.now()}); save(); render();
  await replyAI();
}
async function askAI(text){
  const s = curSession();
  s.chat.push({role:'user', text, at:Date.now()}); save(); render();
  await replyAI();
}
let thinkingTimer = null;
function startThinking(){
  const box = $('chatBox'); if(!box) return;
  const el = document.createElement('div');
  el.className = 'thinking'; el.id = 'thinkingRow';
  el.innerHTML = `<span class="dots"><i></i><i></i><i></i></span><span id="thinkingSec">思考中 0s</span>`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  let sec = 0;
  thinkingTimer = setInterval(()=>{
    sec++;
    const s = $('thinkingSec'); if(s) s.textContent = `思考中 ${sec}s`;
  }, 1000);
}
function stopThinking(){
  clearInterval(thinkingTimer); thinkingTimer = null;
  $('thinkingRow')?.remove();
}

async function replyAI(){
  const s = curSession();
  const ctx = contextSince(s.chat).slice(-8);
  const hist = ctx.map(m => ({role: m.role==='user'?'user':'assistant', content:m.text}));

  if(!S.settings.modelOn){
    const text = '（未启用模型，本地简要建议）\n先看是否在本半月预算内，是否会碰到安全余额；若可替代或可等待，先放 7 天；快乐消费可以有，但别动专项储蓄和安全余额。';
    s.chat.push({role:'assistant', text, at:Date.now()}); save(); render();
    const box=$('chatBox'); if(box) box.scrollTop=box.scrollHeight;
    return;
  }

  startThinking();
  const msgIndex = s.chat.length;
  s.chat.push({role:'assistant', text:'', at:Date.now(), streaming:true});
  let firstToken = true;
  try{
    const full = await callAI(hist, (partial)=>{
      if(firstToken){ stopThinking(); firstToken = false; }
      s.chat[msgIndex].text = partial;
      const box = $('chatBox');
      if(box){
        const wrap = box.children[msgIndex];
        if(wrap){ wrap.querySelector('.bubble').innerHTML = esc(partial) + '<span class="cursor-blink"></span>'; }
        box.scrollTop = box.scrollHeight;
      }
    });
    s.chat[msgIndex].text = full || '（没有收到回复内容）';
    s.chat[msgIndex].streaming = false;
  }catch(e){
    stopThinking();
    s.chat[msgIndex].text = '出错了：' + e.message;
    s.chat[msgIndex].streaming = false;
  }
  save(); render();
  const box=$('chatBox'); if(box) box.scrollTop=box.scrollHeight;
}

async function retryReply(i){
  const s = curSession();
  // remove this assistant message and everything after it, then regenerate
  s.chat = s.chat.slice(0, i);
  save(); render();
  await replyAI();
}
async function reviewPlan(id){
  const p=S.plans.find(x=>x.id===id); if(!p) return;
  const b=budget();
  const prompt = `请审批这笔计划：\n商品：${p.item}\n金额：${money(p.amount)}\n标签：${tag(p.tagId).name}\n备注：${p.note||''}\n总资产：${money(totalAssets())}\n安全余额：${money(S.settings.safe)}\n本半月预算：${b.set?money(b.total):'未设置'}　剩余：${b.set?money(remain()):'-'}`;
  if(!S.settings.modelOn){
    const s = curSession();
    s.chat.push({role:'user', text:prompt, at:Date.now()});
    s.chat.push({role:'assistant', text:localReview(p), at:Date.now()});
    save(); render(); return;
  }
  await askAI(prompt);
}

function planWarnHTML(amount, tagId, inBudget){
  if(!amount) return '';
  const msgs=[]; let level='ok';
  if(totalAssets()-amount < S.settings.safe){ msgs.push('这笔花费后资产可能低于安全余额 '+money(S.settings.safe)+'。'); level='danger'; }
  const b=budget();
  if(inBudget){
    if(b.set){
      const tagLimit=b.tagLimits?.[tagId];
      if(tagLimit){
        const left=Number(tagLimit)-spentByTag(tagId)-amount;
        if(left<0){ msgs.push('该标签本周期预算已超出 '+money(Math.abs(left))+'。'); level=level==='danger'?'danger':'warn'; }
        else if(left<=30){ msgs.push('购买后该标签本周期只剩 '+money(left)+'，接近上限。'); level=level==='danger'?'danger':'warn'; }
      } else {
        const left=remain()-amount;
        if(left<0){ msgs.push('本半月总预算已超出 '+money(Math.abs(left))+'。'); level=level==='danger'?'danger':'warn'; }
        else if(left<=30){ msgs.push('购买后本半月总预算只剩 '+money(left)+'。'); level=level==='danger'?'danger':'warn'; }
      }
    } else {
      msgs.push('本半月预算还没设置，去首页"设预算"看看。'); level=level==='danger'?'danger':'warn';
    }
  } else {
    msgs.push('这笔未纳入预算，会挤占其他计划。'); level=level==='danger'?'danger':'warn';
  }
  if(amount>Number(S.settings.quizAmount||25)) msgs.push('金额超过 '+money(S.settings.quizAmount||25)+'，建议确认前再想一下。');
  const cls = level==='danger'?'danger':level==='warn'?'warn':'ok';
  const bg = level==='danger'?'#fef2f2':level==='warn'?'#fffbeb':'#ecfdf5';
  const col = level==='danger'?'#b91c1c':level==='warn'?'#b45309':'#047857';
  return `<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:${bg};color:${col};font-size:12.5px;line-height:1.6">${msgs.join(' ')||'在预算范围内，可以正常安排。'}</div>`;
}

function viewCal(){
  const month = S.ui.month || ym(new Date());
  const [y,m] = month.split('-').map(Number);
  const first = new Date(y,m-1,1).getDay();
  const days = new Date(y,m,0).getDate();
  const monTxs = S.txs.filter(t=>t.date.startsWith(month));
  const monIncome = monTxs.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0);
  const monExpense = monTxs.filter(t=>t.type==='expense' && !t.refunded).reduce((a,b)=>a+Number(b.amount),0);
  let cells = '';
  for(let i=0;i<first;i++) cells += '<div></div>';
  for(let d=1;d<=days;d++){
    const ds = `${month}-${String(d).padStart(2,'0')}`;
    const exp = S.txs.filter(t=>t.date===ds && t.type==='expense' && !t.refunded).reduce((a,b)=>a+Number(b.amount),0);
    const inc = S.txs.filter(t=>t.date===ds && t.type==='income').reduce((a,b)=>a+Number(b.amount),0);
    const sel = S.ui.calDay===ds ? 'sel' : '';
    cells += `<button type="button" class="day on ${ds===today()?'today':''} ${sel}" data-day="${ds}">
      <b>${d}</b>${inc?`<i>+${inc.toFixed(0)}</i>`:''}${exp?`<em>-${exp.toFixed(0)}</em>`:''}
    </button>`;
  }
  const dayFilter = S.ui.calDay;
  const list = (dayFilter ? S.txs.filter(t=>t.date===dayFilter) : monTxs)
    .sort((a,b)=>b.date.localeCompare(a.date) || (b.id>a.id?1:-1)).slice(0,60);
  const income = list.filter(t=>t.type==='income');
  const expense = list.filter(t=>t.type==='expense');
  const transfer = list.filter(t=>t.type==='transfer');
  return `
  <div class="card">
    <div class="row">
      <button class="btn sm line" type="button" id="prevM">← 上月</button>
      <button type="button" id="monthChartBtn" class="month-tap" style="border:0;background:transparent;font-weight:700;font-size:15px;color:var(--text);display:flex;align-items:center;gap:5px">
        ${month} ${svgChartIcon()}
      </button>
      <button class="btn sm line" type="button" id="nextM">下月 →</button>
    </div>
    <div class="hero" style="margin-top:10px">
      <div class="metric"><span>本月收入</span><b style="color:#047857">${money(monIncome)}</b></div>
      <div class="metric"><span>本月支出</span><b style="color:#b91c1c">${money(monExpense)}</b></div>
    </div>
    <div class="cal" style="margin-top:12px">
      ${['日','一','二','三','四','五','六'].map(x=>`<div class="hd">${x}</div>`).join('')}
      ${cells}
    </div>
  </div>
  <div class="section-title"><h2>${dayFilter?dayFilter+' 明细':'本月流水'}</h2>${dayFilter?'<button class="btn sm line" type="button" id="clearDay">看全月</button>':''}</div>
  <div class="card" id="dayList">
    ${income.length?`<div class="muted" style="margin-bottom:4px;color:#047857">收入</div>${income.map(txLine).join('')}`:''}
    ${expense.length?`<div class="muted" style="margin:10px 0 4px;color:#b91c1c">支出</div>${expense.map(txLine).join('')}`:''}
    ${transfer.length?`<div class="muted" style="margin:10px 0 4px">内部转账（不计收支）</div>${transfer.map(txLine).join('')}`:''}
    ${!list.length?`<div class="empty">这里还没有流水</div>`:''}
  </div>`;
}

function openMonthChart(month){
  const [y,m] = month.split('-').map(Number);
  const days = new Date(y,m,0).getDate();
  const dailyExp = Array(days).fill(0), dailyInc = Array(days).fill(0);
  S.txs.forEach(t=>{
    if(!t.date.startsWith(month)) return;
    const d = Number(t.date.slice(8,10)) - 1;
    if(t.type==='expense' && !t.refunded) dailyExp[d] += Number(t.amount);
    if(t.type==='income') dailyInc[d] += Number(t.amount);
  });
  openModal(`<div class="row"><h3>${month} 收支趋势</h3><button class="iconbtn" type="button" id="mc">${svgX()}</button></div>
    <canvas id="monthChartCanvas" class="chart-modal-canvas"></canvas>
    <div class="chart-legend">
      <span><i style="background:#0d9488"></i>支出</span>
      <span><i style="background:#047857"></i>收入</span>
    </div>`);
  $('mc').onclick=closeModal;
  drawLineChart('monthChartCanvas', [
    {label:'支出', color:'#0d9488', data:dailyExp},
    {label:'收入', color:'#047857', data:dailyInc}
  ]);
}

function drawLineChart(canvasId, series){
  const canvas = $(canvasId); if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 360, h = rect.height || 220;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);

  const allVals = series.flatMap(s=>s.data);
  const max = Math.max(1, ...allVals);
  const days = series[0]?.data.length || 30;
  const padL=32, padR=10, padT=10, padB=20;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const x = i => padL + (i/(days-1||1))*plotW;
  const y = v => padT + plotH - (v/max)*plotH;

  ctx.strokeStyle = '#eef0f2'; ctx.lineWidth = 1;
  ctx.fillStyle = '#9ca3af'; ctx.font = '9px -apple-system,sans-serif';
  for(let i=0;i<=3;i++){
    const val = max/3*i;
    const yy = y(val);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w-padR, yy); ctx.stroke();
    ctx.fillText(Math.round(val), 2, yy+3);
  }
  ctx.textAlign='center';
  [1, Math.round(days/2), days].forEach(d=>{
    ctx.fillText(d+'日', x(d-1), h-6);
  });

  series.forEach(s=>{
    if(!s.data.some(v=>v>0)) return;
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin='round';
    ctx.beginPath();
    s.data.forEach((v,i)=>{ i===0 ? ctx.moveTo(x(i),y(v)) : ctx.lineTo(x(i),y(v)); });
    ctx.stroke();
  });
}

        t.over=$('et_over').checked; t.quiz=$('et_quiz').checked; t.cool=Number($('et_cool').value||0);
        save(); closeModal(); render();
      };
    });
    document.querySelectorAll('[data-del-tag]').forEach(b=>b.onclick=()=>{
      if(S.tags.length<=1) return toast('至少保留一个标签');
      if(!confirm('确定删除这个标签吗？相关流水和计划会转到"其他"。')) return;
      const other = S.tags.find(t=>t.id==='other') || S.tags.find(t=>t.id!==b.dataset.delTag);
      S.txs.forEach(t=>{ if(t.tagId===b.dataset.delTag) t.tagId=other.id; });
      S.plans.forEach(p=>{ if(p.tagId===b.dataset.delTag) p.tagId=other.id; });
      S.tags = S.tags.filter(t=>t.id!==b.dataset.delTag); save(); render();
    });
  }

  if(p==='goals'){
    $('addGoal').onclick=()=>{
      const name=prompt('目标名称'); if(!name) return;
      const target=Number(prompt('目标金额','1000')||0);
      S.goals.push({id:uid(), name, target, saved:0}); save(); render();
    };
    document.querySelectorAll('[data-g-add]').forEach(b=>b.onclick=()=>{
      const g=S.goals.find(x=>x.id===b.dataset.gAdd);
      const n=Number(prompt('存入金额','100')||0); if(!(n>0)) return; g.saved=Number(g.saved)+n; save(); render();
    });
    document.querySelectorAll('[data-g-del]').forEach(b=>b.onclick=()=>{
      if(!confirm('确定删除这个储蓄目标吗？')) return;
      S.goals=S.goals.filter(x=>x.id!==b.dataset.gDel); save(); render();
    });
  }

  if(p==='model'){
    $('saveModel').onclick=()=>{
      S.settings.modelOn=$('m_on').checked;
      S.api.baseURL=$('m_url').value.trim();
      S.api.apiKey=$('m_key').value.trim();
      S.api.model=$('m_model').value;
      S.api.timeout=Number($('m_timeout').value||30000);
      save(); toast('已保存');
    };
    $('clearModel').onclick=()=>{
      if(!confirm('确定清除本地保存的URL、Key和模型选择吗？')) return;
      S.api.baseURL=''; S.api.apiKey=''; S.api.models=[]; S.settings.modelOn=false;
      save(); toast('已清除'); render();
    };
    $('pullModels').onclick=async ()=>{
      S.api.baseURL=$('m_url').value.trim(); S.api.apiKey=$('m_key').value.trim();
      $('m_msg').textContent='拉取中…';
      try{
        const res=await fetch(S.api.baseURL.replace(/\/$/,'')+'/models',{headers:{Authorization:'Bearer '+S.api.apiKey}});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const data=await res.json();
        S.api.models=(data.data||[]).map(x=>x.id).filter(Boolean);
        if(S.api.models.length && !S.api.models.includes(S.api.model)) S.api.model=S.api.models[0];
        save(); $('m_msg').textContent='已拉取 '+S.api.models.length+' 个模型'; render();
      }catch(e){
        if(/Failed to fetch|NetworkError/i.test(String(e.message||e)))
          $('m_msg').textContent='当前API服务不支持浏览器直接访问，需要更换支持浏览器调用的接口，或使用自己的代理服务。';
        else $('m_msg').textContent='拉取失败：'+e.message;
      }
    };
    $('testModel').onclick=async ()=>{
      S.settings.modelOn=true;
      S.api.baseURL=$('m_url').value.trim();
      S.api.apiKey=$('m_key').value.trim();
      S.api.model=$('m_model').value;
      $('m_msg').textContent='测试中…';
      const start=Date.now();
      try{
        const t=await callAI([{role:'user', content:'只回复：连接成功'}]);
        $('m_msg').textContent=`连接成功 · 耗时${Date.now()-start}ms · 模型：${S.api.model} · 返回：`+String(t).slice(0,40);
      }
      catch(e){ $('m_msg').textContent='错误：'+e.message; }
    };
    $('restorePrompt').onclick=()=>{ $('m_prompt').value=PROMPT; };
    $('savePrompt').onclick=()=>{ S.api.prompt=$('m_prompt').value; save(); toast('提示词已保存'); };
  }

  if(p==='prefs'){
    $('savePrefs').onclick=()=>{
      S.settings.safe=Number($('p_safe').value||0);
      S.settings.quizAmount=Number($('p_quiz').value||25);
      save(); toast('已保存');
    };
  }

  if(p==='data'){
    $('exportJson').onclick=()=>{
      const dump=JSON.parse(JSON.stringify(S));
      dump.api.apiKey='';
      const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='清醒消费备份-'+today()+'.json'; a.click();
      toast('已导出');
    };
    $('exportCsv').onclick=()=>{
      const header=['日期','收支类型','金额','账户','标签','用途','是否退款','备注'];
      const rows=S.txs.map(t=>[t.date, t.type==='income'?'收入':t.type==='expense'?'支出':'内部转账', t.amount, acc(t.accountId)?.name||'', t.tagId?tag(t.tagId).name:'', t.item||'', t.refunded?'是':'否', t.note||'']);
      const csv=[header,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
      const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='流水导出-'+today()+'.csv'; a.click();
      toast('已导出');
    };
    $('importJson').onchange=async e=>{
      const f=e.target.files?.[0]; if(!f) return;
      try{
        const data=JSON.parse(await f.text());
        const accCount=(data.accounts||[]).length, txCount=(data.txs||[]).length;
        if(!confirm(`文件包含 ${accCount} 个账户，${txCount} 条流水。导入将覆盖当前全部数据，继续？`)) return;
        const base=DEFAULT();
        S=Object.assign(base, data, {
          settings:Object.assign(base.settings, data.settings||{}),
          api:Object.assign(base.api, data.api||{}),
          ui:Object.assign(base.ui, data.ui||{})
        });
        save(); toast('导入完成'); render();
      }catch(err){ toast('导入失败：文件格式不对'); }
    };
    $('clearTxOnly').onclick=()=>{
      if(!confirm('确定清空所有流水吗？这不会自动恢复账户余额，建议先导出备份。')) return;
      S.txs=[]; save(); toast('流水已清空'); render();
    };
    $('resetAll').onclick=()=>{
      if(!confirm('确定恢复初始示例吗？当前全部数据会被覆盖，建议先导出备份。')) return;
      S=DEFAULT(); save(); toast('已恢复'); render();
    };
  }
}

$('nav').addEventListener('click', e => {
  const btn=e.target.closest('button[data-page]'); if(!btn) return;
  page=btn.dataset.page;
  if(page!=='settings') S.ui.setPanel=null;
  save();
  render();
});

function handleQuickAddURL(){
  const params = new URLSearchParams(location.search);
  const type = params.get('quickadd');
  if(type !== 'expense' && type !== 'income') return false;

  const amount = Number(params.get('amount') || 0);
  const note = (params.get('note') || '').slice(0, 60);
  const accParam = params.get('account') || '';
  const tagParam = params.get('tag') || '';

  history.replaceState(null, '', location.pathname);

  if(!(amount > 0)){
    renderQuickAddResult(false, '金额无效，没有记录任何内容。');
    return true;
  }

  let account = S.accounts.find(a => a.id === accParam || a.name === accParam) || S.accounts[0];
  if(!account){ renderQuickAddResult(false, '没有可用账户。'); return true; }

  let tagObj = null;
  if(type === 'expense'){
    tagObj = S.tags.find(t => t.id === tagParam || t.name === tagParam) || S.tags.find(t => t.id === 'other') || S.tags[0];
  }

  if(type === 'expense'){
    account.balance -= amount;
    S.txs.unshift({ id:uid(), type:'expense', amount, accountId:account.id, tagId:tagObj?.id, item:note||'快捷指令支出', date:today(), note, refunded:false });
  } else {
    account.balance += amount;
    S.txs.unshift({ id:uid(), type:'income', amount, accountId:account.id, item:note||'快捷指令收入', date:today(), note, refunded:false });
  }
  save();

  const label = type === 'expense' ? '支出' : '收入';
  renderQuickAddResult(true, `已记录 ${label} ${money(amount)}${note ? '，' + esc(note) : ''}（${esc(account.name)}）`);
  return true;
}

function renderQuickAddResult(ok, message){
  document.body.innerHTML = `
    <div style="max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:${ok?'#f7f8f8':'#fef2f2'}">
      <div style="width:64px;height:64px;border-radius:50%;background:${ok?'#0d9488':'#dc2626'};display:flex;align-items:center;justify-content:center;margin-bottom:16px">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" style="width:32px;height:32px">
          ${ok ? '<path d="M20 6L9 17l-5-5"/>' : '<path d="M18 6L6 18M6 6l12 12"/>'}
        </svg>
      </div>
      <div style="font-size:16px;font-weight:600;color:#111827;line-height:1.6">${message}</div>
      <a href="index.html" style="margin-top:20px;color:#0d9488;font-size:13px;font-weight:600;text-decoration:none">打开完整应用 ›</a>
    </div>`;
}

if(!handleQuickAddURL()){
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
